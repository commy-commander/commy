name: Voice pack

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voice-pack
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the built-in voices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch and check every file
        run: |
          set -euo pipefail
          mkdir -p pack
          jq -r '(.runtime[], (.voices[] | .model, .config)) | [.name, .from, .sha256, (.size | tostring)] | @tsv' \
            apps/desktop/src-tauri/voice-pack.json > files.tsv
          while IFS=$'\t' read -r name from sha size; do
            curl -fsSL --retry 4 --retry-delay 5 -o "pack/$name" "$from"
            echo "$sha  pack/$name" | sha256sum -c -
            test "$(stat -c %s "pack/$name")" = "$size"
          done < files.tsv

      - name: Write the release notes
        run: |
          set -euo pipefail
          {
            echo "Built-in text-to-speech voices for Commy. The app downloads these the first time a built-in voice speaks and checks each file against the hashes in \`apps/desktop/src-tauri/voice-pack.json\`."
            echo
            echo "The engine is Piper, running ONNX Runtime (MIT) and a phonemizer built with espeak-ng (GPL-3.0-or-later). Voice models come from rhasspy/piper-voices (MIT). Recordings:"
            echo
            jq -r '.voices[] | "- \(.name) (\(.lang)): \(.credit)"' apps/desktop/src-tauri/voice-pack.json
          } > notes.md

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(jq -r .release apps/desktop/src-tauri/voice-pack.json)"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Text-to-speech voices" --notes-file notes.md --latest=false
          else
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --latest=false
          fi
          gh release upload "$tag" pack/* --repo "$GITHUB_REPOSITORY" --clobber
          echo "Published $(ls pack | wc -l) files to $tag" >> "$GITHUB_STEP_SUMMARY"
