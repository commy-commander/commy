name: Promote images

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to update
        type: choice
        options: [prod, staging]
        default: prod
      source:
        description: Image tag to promote (blank means staging for prod, dev for staging). Use a version like 0.2.0 to roll back.
        type: string
        required: false

permissions:
  contents: read

env:
  REGISTRY: git.commy.chat
  IMAGES: git.commy.chat/commy

jobs:
  promote:
    name: Promote to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || 'staging' }}
    concurrency: promote-${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Only the owner promotes
        env:
          ACTOR: ${{ github.actor }}
          PROMOTERS: ${{ vars.PROMOTERS || 'commy-commander' }}
        run: |
          case " $PROMOTERS " in
            *" $ACTOR "*) echo "$ACTOR may promote" ;;
            *) echo "$ACTOR is not allowed to promote images"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy/agent

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1

      - name: Check the source tag
        id: source
        env:
          TARGET: ${{ inputs.environment }}
          SOURCE: ${{ inputs.source }}
        run: |
          if [ -z "$SOURCE" ]; then
            if [ "$TARGET" = prod ]; then SOURCE=staging; else SOURCE=dev; fi
          fi
          case "$TARGET:$SOURCE" in
            prod:staging | staging:dev) ;;
            *)
              if ! [[ "$SOURCE" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
                echo "Refusing to promote '$SOURCE' to $TARGET: use staging (for prod), dev (for staging) or a release version such as 0.2.0"
                exit 1
              fi
              ;;
          esac
          echo "tag=$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Sign and retag images
        env:
          TARGET: ${{ inputs.environment }}
          SOURCE: ${{ steps.source.outputs.tag }}
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          [ -n "$COSIGN_KEY" ] || { echo "The COSIGN_PRIVATE_KEY secret is not set"; exit 1; }
          for svc in auth sync; do
            repo="$IMAGES/commy-${svc}"
            digest="$(docker buildx imagetools inspect "$repo:$SOURCE" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            echo "$svc: $repo:$SOURCE ($digest) -> $repo:$TARGET"
            cosign sign --yes --key env://COSIGN_KEY -a "tag=$TARGET" "$repo@$digest"
            docker buildx imagetools create --tag "$repo:$TARGET" "$repo@$digest"
            cosign verify -a "tag=$TARGET" --key deploy/agent/cosign.pub "$repo:$TARGET" >/dev/null
            echo "- \`commy-$svc\`: \`$SOURCE\` → \`$TARGET\` (\`$digest\`, signed with the key in deploy/agent/cosign.pub)" >> "$GITHUB_STEP_SUMMARY"
          done
