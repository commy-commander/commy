name: Cut release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, for example 0.2.0 or 0.2.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cut-release

jobs:
  tag:
    name: Tag v${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Check who is cutting, from which branch
        env:
          ACTOR: ${{ github.actor }}
          RELEASERS: ${{ vars.RELEASERS || 'commy-commander' }}
          REF: ${{ github.ref }}
          VERSION: ${{ inputs.version }}
          HAS_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          case " $RELEASERS " in
            *" $ACTOR "*) ;;
            *) echo "$ACTOR is not allowed to cut releases"; exit 1 ;;
          esac
          case "$REF" in
            refs/heads/main | refs/heads/release/*) ;;
            *) echo "Cut releases from main or a release/* branch, not $REF"; exit 1 ;;
          esac
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Not a version: $VERSION"; exit 1; }
          [ "$HAS_TOKEN" = true ] || { echo "The RELEASE_TOKEN secret is not set. Release tags are protected, so the tag is pushed with a token of an allowed user."; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Create and push the tag
        env:
          TAG: v${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"; exit 1
          fi
          git config user.name "Commy Commander"
          git config user.email "commy.cmd@commy.chat"
          git tag -a "$TAG" -m "Commy $TAG"
          git push origin "refs/tags/$TAG"
          echo "Tagged $TAG on $REF_NAME at $(git rev-parse --short HEAD). The tag push starts Desktop release and Server images for $TAG." >> "$GITHUB_STEP_SUMMARY"
