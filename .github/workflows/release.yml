name: Desktop release

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAURI_CLI_VERSION: "2.12.3"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxrandr-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev \
            libxdo-dev libssl-dev clang cmake

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=24.22.1 <25"

      - name: Release config
        id: version
        uses: ./.github/actions/release-config

      - name: Build and bundle
        working-directory: apps/desktop/src-tauri
        env:
          TEST_BUILD: ${{ steps.version.outputs.test_build }}
          FULL_VERSION: ${{ steps.version.outputs.full }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            export COMMY_VERSION="$FULL_VERSION"
          fi
          echo "Self-updating version: ${COMMY_VERSION:-none}"
          if [ -n "$TEST_BUILD" ]; then
            export COMMY_TEST_BUILD=1
            export COMMY_DEFAULT_ACCOUNT_SERVER=https://staging.commy.chat
            export COMMY_DEFAULT_RELAY=https://relay-staging.commy.chat:8443
            export COMMY_RELAY_QAD_PORT=7843
          fi
          echo "Test build: ${COMMY_TEST_BUILD:-no}"
          echo "Account server: ${COMMY_DEFAULT_ACCOUNT_SERVER:-https://commy.chat}"
          echo "Relay: ${COMMY_DEFAULT_RELAY:-https://relay.commy.chat:8443}"
          if [ -n "${{ matrix.bundles }}" ]; then
            bundle_args=(--bundles "${{ matrix.bundles }}")
          else
            bundle_args=(--no-bundle)
          fi
          npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" build \
            --ci --target "${{ matrix.target }}" "${bundle_args[@]}" \
            --config tauri.release.conf.json

      - name: Collect artifacts
        if: matrix.bundles
        env:
          VERSION: ${{ steps.version.outputs.full }}
          TARGET: ${{ matrix.target }}
        run: |
          out="$PWD/dist"
          mkdir -p "$out"
          bundle="target/$TARGET/release/bundle"
          case "$RUNNER_OS" in
            Windows)
              nsi="target/$TARGET/release/nsis/x64/installer.nsi"
              grep -qiE 'Classes[\\]+commy' "$nsi" || { echo "installer does not register commy://"; grep -n 'URL Protocol' "$nsi"; exit 1; }
              grep -q 'data-folder.nsh' "$nsi" || { echo "installer has no data folder page"; exit 1; }
              cp "$bundle"/nsis/*-setup.exe "$out/Commy_${VERSION}_x64-setup.exe"
              exe="./target/$TARGET/release/commy-desktop.exe"
              zip="$out/Commy_${VERSION}_x64-portable.zip"
              if command -v 7z >/dev/null; then
                7z a -tzip "$zip" "$exe"
              else
                powershell -NoProfile -Command "Compress-Archive -Path '$(cygpath -m "$exe")' -DestinationPath '$(cygpath -m "$zip")'"
              fi
              ;;
            Linux)
              cp "$bundle"/deb/*.deb "$out/Commy_${VERSION}_amd64.deb"
              cp "$bundle"/appimage/*.AppImage "$out/Commy_${VERSION}_amd64.AppImage"
              ;;
          esac
          ls -la "$out"

      - uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: matrix.bundles
        with:
          name: commy-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 90 || 7 }}

      - uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: runner.os == 'macOS'
        with:
          name: macos-bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/commy-desktop
          if-no-files-found: error
          retention-days: 1

  build-macos:
    name: ${{ matrix.name }}
    if: github.server_url == 'https://github.com' || vars.MAC_BUILDS == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15-intel
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            bundles: ""
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            bundles: ""
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep the runner's home folder out of the log
        run: |
          echo "::add-mask::$HOME"
          echo "::add-mask::${HOME//\//\\/}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxrandr-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev \
            libxdo-dev libssl-dev clang cmake

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.server_url == 'https://github.com' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=24.22.1 <25"

      - name: Release config
        id: version
        uses: ./.github/actions/release-config

      - name: Build and bundle
        working-directory: apps/desktop/src-tauri
        env:
          TEST_BUILD: ${{ steps.version.outputs.test_build }}
          FULL_VERSION: ${{ steps.version.outputs.full }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            export COMMY_VERSION="$FULL_VERSION"
          fi
          echo "Self-updating version: ${COMMY_VERSION:-none}"
          if [ -n "$TEST_BUILD" ]; then
            export COMMY_TEST_BUILD=1
            export COMMY_DEFAULT_ACCOUNT_SERVER=https://staging.commy.chat
            export COMMY_DEFAULT_RELAY=https://relay-staging.commy.chat:8443
            export COMMY_RELAY_QAD_PORT=7843
          fi
          echo "Test build: ${COMMY_TEST_BUILD:-no}"
          echo "Account server: ${COMMY_DEFAULT_ACCOUNT_SERVER:-https://commy.chat}"
          echo "Relay: ${COMMY_DEFAULT_RELAY:-https://relay.commy.chat:8443}"
          if [ -n "${{ matrix.bundles }}" ]; then
            bundle_args=(--bundles "${{ matrix.bundles }}")
          else
            bundle_args=(--no-bundle)
          fi
          npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" build \
            --ci --target "${{ matrix.target }}" "${bundle_args[@]}" \
            --config tauri.release.conf.json

      - name: Collect artifacts
        if: matrix.bundles
        env:
          VERSION: ${{ steps.version.outputs.full }}
          TARGET: ${{ matrix.target }}
        run: |
          out="$PWD/dist"
          mkdir -p "$out"
          bundle="target/$TARGET/release/bundle"
          case "$RUNNER_OS" in
            Windows)
              nsi="target/$TARGET/release/nsis/x64/installer.nsi"
              grep -qiE 'Classes[\\]+commy' "$nsi" || { echo "installer does not register commy://"; grep -n 'URL Protocol' "$nsi"; exit 1; }
              grep -q 'data-folder.nsh' "$nsi" || { echo "installer has no data folder page"; exit 1; }
              cp "$bundle"/nsis/*-setup.exe "$out/Commy_${VERSION}_x64-setup.exe"
              exe="./target/$TARGET/release/commy-desktop.exe"
              zip="$out/Commy_${VERSION}_x64-portable.zip"
              if command -v 7z >/dev/null; then
                7z a -tzip "$zip" "$exe"
              else
                powershell -NoProfile -Command "Compress-Archive -Path '$(cygpath -m "$exe")' -DestinationPath '$(cygpath -m "$zip")'"
              fi
              ;;
            Linux)
              cp "$bundle"/deb/*.deb "$out/Commy_${VERSION}_amd64.deb"
              cp "$bundle"/appimage/*.AppImage "$out/Commy_${VERSION}_amd64.AppImage"
              ;;
          esac
          ls -la "$out"

      - uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: matrix.bundles
        with:
          name: commy-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 90 || 7 }}

      - uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: runner.os == 'macOS'
        with:
          name: macos-bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/commy-desktop
          if-no-files-found: error
          retention-days: 1

  macos-universal:
    name: macOS universal
    needs: build-macos
    if: github.server_url == 'https://github.com' || vars.MAC_BUILDS == 'true'
    runs-on: macos-15-intel
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep the runner's home folder out of the log
        run: |
          echo "::add-mask::$HOME"
          echo "::add-mask::${HOME//\//\\/}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=24.22.1 <25"

      - name: Release config
        id: version
        uses: ./.github/actions/release-config

      - uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          pattern: macos-bin-*
          path: bins

      - name: Join the arm64 and x64 binaries
        run: |
          out=target/universal-apple-darwin/release
          mkdir -p "$out"
          lipo -create -output "$out/commy-desktop" \
            bins/macos-bin-aarch64-apple-darwin/commy-desktop \
            bins/macos-bin-x86_64-apple-darwin/commy-desktop
          chmod +x "$out/commy-desktop"
          lipo -info "$out/commy-desktop"

      - name: Find the Developer ID certificate
        id: signing
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          found="$(security find-identity -v -p codesigning | grep -m1 '"Developer ID Application: ' || true)"
          if [ -z "$found" ]; then
            echo "::warning::No Developer ID Application certificate on this Mac, so the app is ad hoc signed and not notarized"
            exit 0
          fi
          echo "Signing with $(cut -d'"' -f2 <<< "$found")"
          echo "identity=$(awk '{print $2}' <<< "$found")" >> "$GITHUB_OUTPUT"
          if [ -z "$API_KEY_ID" ] || [ ! -f ~/.appstoreconnect/private_keys/"AuthKey_${API_KEY_ID}.p8" ]; then
            echo "::error::Notarizing needs the APPLE_API_KEY_ID secret and its AuthKey .p8 file in ~/.appstoreconnect/private_keys on the Mac"
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Bundle
        working-directory: apps/desktop/src-tauri
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$IDENTITY" ]; then
            export APPLE_SIGNING_IDENTITY="$IDENTITY" APPLE_API_KEY="$API_KEY_ID" APPLE_API_ISSUER="$API_ISSUER"
          fi
          npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" bundle \
            --ci --target universal-apple-darwin --bundles app,dmg \
            --config tauri.release.conf.json

      - name: Notarize the disk image
        if: steps.signing.outputs.signed == 'true'
        working-directory: target/universal-apple-darwin/release/bundle
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          dmg="$(ls dmg/*.dmg)"
          xcrun notarytool submit "$dmg" --wait \
            --key ~/.appstoreconnect/private_keys/"AuthKey_${API_KEY_ID}.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER"
          xcrun stapler staple "$dmg"
          xcrun stapler validate macos/Commy.app
          spctl --assess --type execute --verbose=2 macos/Commy.app
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          codesign -d --entitlements - --xml macos/Commy.app | grep -q com.apple.security.device.audio-input \
            || { echo "::error::Commy.app is missing the microphone entitlement"; exit 1; }

      - name: Collect artifacts
        env:
          VERSION: ${{ steps.version.outputs.full }}
          TARGET: universal-apple-darwin
        run: |
          out="$PWD/dist"
          mkdir -p "$out"
          bundle="target/$TARGET/release/bundle"
          scheme="$(/usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" "$bundle/macos/Commy.app/Contents/Info.plist")"
          [ "$scheme" = commy ] || { echo "Info.plist does not declare commy://"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$bundle/macos/Commy.app"
          cp "$bundle"/dmg/*.dmg "$out/Commy_${VERSION}_universal.dmg"
          COPYFILE_DISABLE=1 tar -czf "$out/Commy_${VERSION}_universal.app.tar.gz" -C "$bundle/macos" Commy.app
          ls -la "$out"

      - uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: commy-universal-apple-darwin
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 90 || 7 }}

  streamdeck:
    name: Stream Deck plugin
    uses: ./.github/workflows/streamdeck.yml

  bot:
    name: Bot builds
    uses: ./.github/workflows/bot.yml

  publish:
    name: Publish release
    needs: [build, build-macos, macos-universal, streamdeck, bot]
    if: github.ref_type == 'tag' && !cancelled() && !failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          pattern: commy-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt

      - name: Sign the self-update files
        working-directory: dist
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::The TAURI_SIGNING_PRIVATE_KEY secret is not set: no latest.json, so installed apps will not update to $TAG"
            exit 0
          fi
          version="${TAG#v}"
          sign() {
            npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" signer sign "$1" >/dev/null
            cat "$1.sig"
            rm "$1.sig"
          }
          base="https://releases.commy.chat/$TAG"
          platforms='{}'
          add() {
            [ -f "$2" ] || { echo "::warning::$2 is missing, so $1 apps will not update to $TAG"; return 0; }
            platforms="$(jq --arg key "$1" --arg url "$base/$2" --arg signature "$(sign "$2")" \
              '. + {($key): {url: $url, signature: $signature}}' <<< "$platforms")"
          }
          add windows-x86_64 "Commy_${version}_x64-setup.exe"
          add darwin-aarch64 "Commy_${version}_universal.app.tar.gz"
          add darwin-x86_64 "Commy_${version}_universal.app.tar.gz"
          add linux-x86_64-appimage "Commy_${version}_amd64.AppImage"
          jq -n --arg version "$version" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson platforms "$platforms" \
            '{version: $version, notes: "Commy \($version)", pub_date: $date, platforms: $platforms}' > latest.json
          jq . latest.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          sparse-checkout: |
            deploy/releases
            deploy/agent

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1

      - name: Sign the checksums
        id: checksums
        working-directory: dist
        env:
          ON_GITHUB: ${{ github.server_url == 'https://github.com' }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ "$ON_GITHUB" = true ]; then
            cosign sign-blob --yes --output-signature SHA256SUMS.txt.sig --output-certificate SHA256SUMS.txt.pem SHA256SUMS.txt
            cosign verify-blob --certificate SHA256SUMS.txt.pem --signature SHA256SUMS.txt.sig \
              --certificate-identity "$IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS.txt
            echo "signed=keyless" >> "$GITHUB_OUTPUT"
          elif [ -n "$COSIGN_KEY" ]; then
            cosign sign-blob --yes --key env://COSIGN_KEY --bundle SHA256SUMS.txt.bundle SHA256SUMS.txt
            cosign verify-blob --key ../source/deploy/agent/cosign.pub --bundle SHA256SUMS.txt.bundle SHA256SUMS.txt
            echo "signed=key" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The COSIGN_PRIVATE_KEY secret is not set, so SHA256SUMS.txt is not signed"
          fi

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.server_url == 'https://github.com'
        with:
          subject-path: |
            dist/Commy_*
            dist/commy-soundboard.streamDeckPlugin
            dist/commy-bot-*
            dist/SHA256SUMS.txt

      - name: Publish to releases.commy.chat
        env:
          TAG: ${{ github.ref_name }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node source/deploy/releases/publish.mjs "$TAG" dist

      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
          ON_GITHUB: ${{ github.server_url == 'https://github.com' }}
          CHECKSUMS_SIGNED: ${{ steps.checksums.outputs.signed }}
          MAC_SIGNED: ${{ needs.macos-universal.outputs.signed }}
        run: |
          cat > notes.md <<EOF
          ## Downloads

          Every file is at https://releases.commy.chat/$TAG/ and the newest version is always on
          https://commy.chat/download.

          EOF
          cat >> notes.md <<'EOF'
          ## Downloads

          | Platform | File |
          |----------|------|
          | Windows 10/11 | `*_x64-setup.exe` (installer) or `*_x64-portable.zip` |
          | macOS 11+ (Apple Silicon and Intel) | `*_universal.dmg` |
          | Linux x64 | `*_amd64.AppImage` or `*_amd64.deb` |
          | Stream Deck 7.1+ (Windows and macOS) | `commy-soundboard.streamDeckPlugin` |
          | Bots (`commy-bot`, see the [bot guide](https://git.commy.chat/commy/commy/src/branch/main/crates/commy-bot/README.md)) | `commy-bot-windows-x64.zip`, `commy-bot-macos-universal.tar.gz` or `commy-bot-linux-x64.tar.gz` |

          EOF
          if [ "$MAC_SIGNED" = true ]; then
            cat >> notes.md <<'EOF'
          The macOS app is signed with an Apple Developer ID and notarized by Apple. The Windows
          build is not code signed yet: choose **More info > Run anyway** in SmartScreen.
          EOF
          else
            cat >> notes.md <<'EOF'
          These builds are not code signed yet. On Windows choose **More info > Run anyway**
          in SmartScreen. On macOS right click Commy.app and choose **Open** the first time,
          or run `xattr -dr com.apple.quarantine /Applications/Commy.app`.
          EOF
          fi
          cat >> notes.md <<'EOF'
          Verify downloads against `SHA256SUMS.txt`.
          EOF
          if [ "$ON_GITHUB" = true ]; then
            cat >> notes.md <<'EOF'
          That file is signed with cosign (`SHA256SUMS.txt.sig` and `SHA256SUMS.txt.pem`), and
          every file carries a build provenance attestation:
          `gh attestation verify <file> --repo commy-commander/commy`. The README explains both checks.
          EOF
          elif [ "$CHECKSUMS_SIGNED" = key ]; then
            cat >> notes.md <<'EOF'
          That file is signed with the Commy release key (`SHA256SUMS.txt.bundle`, public key in
          `deploy/agent/cosign.pub`). The README explains the check.
          EOF
          fi
          cat notes.md

      - name: Create the GitHub release
        if: github.server_url == 'https://github.com'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--generate-notes --title "Commy ${TAG}")
          [[ "$TAG" == *-test* ]] && flags+=(--draft)
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --notes-file notes.md "${flags[@]}"

      - name: Create the forge release
        if: github.server_url != 'https://github.com'
        env:
          TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=false; [[ "$TAG" == *-* ]] && prerelease=true
          draft=false; [[ "$TAG" == *-test* ]] && draft=true
          jq -n --arg tag "$TAG" --rawfile body notes.md --argjson prerelease "$prerelease" --argjson draft "$draft" \
            '{tag_name: $tag, name: "Commy \($tag)", body: $body, prerelease: $prerelease, draft: $draft}' |
            curl -fsS -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" --data @- \
              "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases" -o /dev/null
