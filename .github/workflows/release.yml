# Builds the desktop app for Windows, macOS and Linux and publishes a GitHub Release.
# Run "Cut release" (or push a tag like v0.2.0) to release. Tags containing "-test" create a draft release,
# other tags with a suffix (v0.2.0-rc.1) a pre-release test build that uses only the staging servers.
# Pull requests that touch this file and manual runs build everything without publishing.
# To check that a branch compiles, use "Rust checks" instead; it takes a few minutes.
# Pushes to main that change dependencies, and a twice weekly schedule, build on main
# so tag builds start from warm dependency caches (tags can only read caches from main).

name: Desktop release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/release.yml"
      - ".github/actions/release-config/**"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/actions/release-config/**"
  schedule:
    # Unused caches expire after 7 days
    - cron: "17 4 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TAURI_CLI_VERSION: "2"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
          # The two macOS halves build side by side; "macOS universal" joins and bundles them
          - name: macOS arm64
            # Pinned: macos-latest twice sat 15 minutes without a runner and was cancelled
            os: macos-15
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - name: macOS x64
            os: macos-15
            target: x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxrandr-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev \
            libxdo-dev libssl-dev clang cmake

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # Only main's caches are readable by tags and pull requests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Release config
        id: version
        uses: ./.github/actions/release-config

      - name: Build and bundle
        working-directory: apps/desktop/src-tauri
        env:
          TEST_BUILD: ${{ steps.version.outputs.test_build }}
          FULL_VERSION: ${{ steps.version.outputs.full }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            export COMMY_VERSION="$FULL_VERSION"
          fi
          echo "Self-updating version: ${COMMY_VERSION:-none}"
          if [ -n "$TEST_BUILD" ]; then
            export COMMY_TEST_BUILD=1
            export COMMY_DEFAULT_ACCOUNT_SERVER=https://staging.commy.chat
            export COMMY_DEFAULT_RELAY=https://relay-staging.commy.chat:8443
            export COMMY_DEFAULT_RELAY_STUN_PORT=3479
          fi
          echo "Test build: ${COMMY_TEST_BUILD:-no}"
          echo "Account server: ${COMMY_DEFAULT_ACCOUNT_SERVER:-https://commy.chat}"
          echo "Relay: ${COMMY_DEFAULT_RELAY:-https://relay.commy.chat:8443}"
          if [ -n "${{ matrix.bundles }}" ]; then
            bundle_args=(--bundles "${{ matrix.bundles }}")
          else
            bundle_args=(--no-bundle)
          fi
          npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" build \
            --ci --target "${{ matrix.target }}" "${bundle_args[@]}" \
            --config tauri.release.conf.json

      - name: Collect artifacts
        if: matrix.bundles
        env:
          VERSION: ${{ steps.version.outputs.full }}
          TARGET: ${{ matrix.target }}
        run: |
          out="$PWD/dist"
          mkdir -p "$out"
          bundle="target/$TARGET/release/bundle"
          case "$RUNNER_OS" in
            Windows)
              nsi="target/$TARGET/release/nsis/x64/installer.nsi"
              grep -qiE 'Classes[\\]+commy' "$nsi" || { echo "installer does not register commy://"; grep -n 'URL Protocol' "$nsi"; exit 1; }
              cp "$bundle"/nsis/*-setup.exe "$out/Commy_${VERSION}_x64-setup.exe"
              7z a -tzip "$out/Commy_${VERSION}_x64-portable.zip" "./target/$TARGET/release/commy-desktop.exe"
              ;;
            Linux)
              cp "$bundle"/deb/*.deb "$out/Commy_${VERSION}_amd64.deb"
              cp "$bundle"/appimage/*.AppImage "$out/Commy_${VERSION}_amd64.AppImage"
              ;;
          esac
          ls -la "$out"

      - uses: actions/upload-artifact@v4
        if: matrix.bundles
        with:
          name: commy-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 90 || 7 }}

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: macos-bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/commy-desktop
          if-no-files-found: error
          retention-days: 1

  macos-universal:
    name: macOS universal
    needs: build
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Release config
        id: version
        uses: ./.github/actions/release-config

      - uses: actions/download-artifact@v4
        with:
          pattern: macos-bin-*
          path: bins

      # The same join "tauri build --target universal-apple-darwin" does after building both halves
      - name: Join the arm64 and x64 binaries
        run: |
          out=target/universal-apple-darwin/release
          mkdir -p "$out"
          lipo -create -output "$out/commy-desktop" \
            bins/macos-bin-aarch64-apple-darwin/commy-desktop \
            bins/macos-bin-x86_64-apple-darwin/commy-desktop
          chmod +x "$out/commy-desktop"
          lipo -info "$out/commy-desktop"

      - name: Bundle
        working-directory: apps/desktop/src-tauri
        run: |
          npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" bundle \
            --ci --target universal-apple-darwin --bundles app,dmg \
            --config tauri.release.conf.json

      - name: Collect artifacts
        env:
          VERSION: ${{ steps.version.outputs.full }}
          TARGET: universal-apple-darwin
        run: |
          out="$PWD/dist"
          mkdir -p "$out"
          bundle="target/$TARGET/release/bundle"
          scheme="$(/usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" "$bundle/macos/Commy.app/Contents/Info.plist")"
          [ "$scheme" = commy ] || { echo "Info.plist does not declare commy://"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$bundle/macos/Commy.app"
          cp "$bundle"/dmg/*.dmg "$out/Commy_${VERSION}_universal.dmg"
          COPYFILE_DISABLE=1 tar -czf "$out/Commy_${VERSION}_universal.app.tar.gz" -C "$bundle/macos" Commy.app
          ls -la "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: commy-universal-apple-darwin
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 90 || 7 }}

  publish:
    name: Publish release
    needs: [build, macos-universal]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: commy-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt

      - name: Sign the self-update files
        working-directory: dist
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::The TAURI_SIGNING_PRIVATE_KEY secret is not set: no latest.json, so installed apps will not update to $TAG"
            exit 0
          fi
          version="${TAG#v}"
          sign() {
            npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" signer sign "$1" >/dev/null
            cat "$1.sig"
            rm "$1.sig"
          }
          windows="$(sign "Commy_${version}_x64-setup.exe")"
          macos="$(sign "Commy_${version}_universal.app.tar.gz")"
          appimage="$(sign "Commy_${version}_amd64.AppImage")"
          jq -n \
            --arg version "$version" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            --arg windows "$windows" --arg macos "$macos" --arg appimage "$appimage" \
            '{
              version: $version,
              notes: "Commy \($version)",
              pub_date: $date,
              platforms: {
                "windows-x86_64": { url: "\($base)/Commy_\($version)_x64-setup.exe", signature: $windows },
                "darwin-aarch64": { url: "\($base)/Commy_\($version)_universal.app.tar.gz", signature: $macos },
                "darwin-x86_64": { url: "\($base)/Commy_\($version)_universal.app.tar.gz", signature: $macos },
                "linux-x86_64-appimage": { url: "\($base)/Commy_\($version)_amd64.AppImage", signature: $appimage }
              }
            }' > latest.json
          jq . latest.json

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--generate-notes --title "Commy ${TAG}")
          [[ "$TAG" == *-test* ]] && flags+=(--draft)
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          cat > notes.md <<'EOF'
          ## Downloads

          | Platform | File |
          |----------|------|
          | Windows 10/11 | `*_x64-setup.exe` (installer) or `*_x64-portable.zip` |
          | macOS 11+ (Apple Silicon and Intel) | `*_universal.dmg` |
          | Linux x64 | `*_amd64.AppImage` or `*_amd64.deb` |

          These builds are not code signed yet. On Windows choose **More info > Run anyway**
          in SmartScreen. On macOS right click Commy.app and choose **Open** the first time,
          or run `xattr -dr com.apple.quarantine /Applications/Commy.app`.
          Verify downloads against `SHA256SUMS.txt`.
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --notes-file notes.md "${flags[@]}"
