name: List alerts
on:
  push:
    branches: [claude/project-thread-2v0cri]
permissions:
  contents: read
  security-events: read
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/code-scanning/analyses?ref=refs/heads/main&per_page=20" --jq '[.[] | select(.category=="/language:rust")][0].id')
          gh api "repos/$GITHUB_REPOSITORY/code-scanning/analyses?ref=refs/heads/main&per_page=20" --jq '[.[] | select(.category=="/language:rust")][0] | [.id, .commit_sha, .created_at, .tool.version] | @tsv'
          gh api -H "Accept: application/sarif+json" "repos/$GITHUB_REPOSITORY/code-scanning/analyses/$id" > rust.sarif
          python3 - <<'PY'
          import json
          d=json.load(open('rust.sarif'))
          for r in d['runs'][0]['results']:
              u=r['locations'][0]['physicalLocation']['artifactLocation']['uri']
              if 'picture' not in u: continue
              print('==', u, r['locations'][0]['physicalLocation']['region']['startLine'], r['message']['text'])
              for cf in r.get('codeFlows', []):
                  for tf in cf['threadFlows']:
                      for loc in tf['locations']:
                          pl=loc['location']['physicalLocation']
                          print('   ', pl['artifactLocation']['uri'], pl['region']['startLine'], loc['location'].get('message', {}).get('text', ''))
                  print('   --')
          PY
