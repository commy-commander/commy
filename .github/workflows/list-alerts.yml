name: List alerts
on:
  push:
    branches: [claude/project-thread-2v0cri]
permissions:
  contents: read
  security-events: read
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&per_page=100" --paginate --jq '.[] | [.number, .rule.id, (.rule.security_severity_level // .rule.severity), .most_recent_instance.location.path, .most_recent_instance.location.start_line, .most_recent_instance.location.end_line, .created_at, .most_recent_instance.message.text] | @tsv'
          echo ---DISMISSED-COUNT---
          gh api "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=dismissed&per_page=100" --paginate --jq '.[] | .number' | wc -l
