name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: commy-any
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256_LINUX_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          SHA256_DARWIN_ARM64: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
          SHA256_DARWIN_X64: dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) platform=linux_x64 sha256="$SHA256_LINUX_X64" ;;
            Darwin-arm64) platform=darwin_arm64 sha256="$SHA256_DARWIN_ARM64" ;;
            Darwin-x86_64) platform=darwin_x64 sha256="$SHA256_DARWIN_X64" ;;
            *) echo "no gitleaks build pinned for $(uname -s)-$(uname -m)"; exit 1 ;;
          esac
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_${platform}.tar.gz"
          if command -v sha256sum >/dev/null; then
            echo "$sha256  gitleaks.tar.gz" | sha256sum -c -
          else
            echo "$sha256  gitleaks.tar.gz" | shasum -a 256 -c -
          fi
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
      - name: Scan the new commits
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE" ]; then
            range="origin/$BASE..HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="HEAD"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --log-opts="$range" .
