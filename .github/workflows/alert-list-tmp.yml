name: Alert list
on:
  push:
    branches: [claude/alert-list-tmp]
permissions:
  contents: read
  security-events: write
jobs:
  dismiss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS=$'\t' read -r number reason comment; do
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/code-scanning/alerts/$number" \
              -f state=dismissed -f dismissed_reason="$reason" -f dismissed_comment="$comment" \
              --jq '[.number, .state, .dismissed_reason] | @tsv'
          done < .github/dismiss.tsv
          gh api --paginate "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&per_page=100" --jq '.[] | [.number, .rule.id, .most_recent_instance.location.path] | @tsv'
