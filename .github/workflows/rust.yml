name: Rust checks

on:
  push:
    branches: [main]
    paths: &rust-paths
      - "crates/**"
      - "apps/desktop/src-tauri/**"
      - "apps/web/src/**"
      - "apps/web/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
      - ".github/actions/rust-check/**"
  pull_request:
    paths: *rust-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  platforms:
    name: Pick platforms
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      linux: ${{ steps.pick.outputs.linux }}
      windows: ${{ steps.pick.outputs.windows }}
      macos: ${{ steps.pick.outputs.macos }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          pick() {
            echo "linux=$1" >> "$GITHUB_OUTPUT"
            echo "windows=$2" >> "$GITHUB_OUTPUT"
            echo "macos=$2" >> "$GITHUB_OUTPUT"
            echo "Linux: $1, Windows and macOS: $2"
          }
          if [ -z "$PR" ]; then
            pick true true
            exit 0
          fi
          files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')"
          not_compiled='\.md$|^crates/commy-bot/clients/'
          phone_only='^apps/desktop/src-tauri/(gen/|tauri\.(android|ios)\.conf\.json$|Info\.ios\.plist$|package(-lock)?\.json$)|/phone\.rs$'
          no_os_code='^apps/web/|^crates/commy-(view|bot)/'
          compiled="$(printf '%s\n' "$files" | grep -Ev "$not_compiled|$phone_only" || true)"
          if [ -z "$compiled" ]; then
            pick false false
          elif printf '%s\n' "$compiled" | grep -Evq "$no_os_code"; then
            pick true true
          else
            pick true false
          fi

  linux:
    name: Linux tests
    needs: platforms
    if: needs.platforms.outputs.linux == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-check

  windows:
    name: Windows check
    needs: platforms
    if: needs.platforms.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-check

  macos:
    name: macOS check
    needs: platforms
    if: needs.platforms.outputs.macos == 'true'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-check
