name: Rust checks

on:
  push:
    branches: [main]
    paths: &rust-paths
      - "crates/**"
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/apple-sign-in/**"
      - "apps/desktop/app-lock/**"
      - "apps/web/src/**"
      - "apps/web/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
      - ".github/actions/rust-check/**"
  pull_request:
    paths: *rust-paths
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  platforms:
    name: Pick platforms
    runs-on: commy-any
    permissions:
      contents: read
    outputs:
      linux: ${{ steps.pick.outputs.linux }}
      windows: ${{ steps.pick.outputs.windows }}
      macos: ${{ steps.pick.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: pick
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          pick() {
            echo "linux=$1" >> "$GITHUB_OUTPUT"
            echo "windows=$2" >> "$GITHUB_OUTPUT"
            echo "macos=$2" >> "$GITHUB_OUTPUT"
            echo "Linux: $1, Windows and macOS: $2"
          }
          if [ -z "$PR" ]; then
            pick true true
            exit 0
          fi
          files="$(git diff --name-only "origin/$BASE...HEAD")"
          not_compiled='\.md$|^crates/commy-bot/clients/'
          phone_only='^apps/desktop/src-tauri/(gen/|tauri\.(android|ios)\.conf\.json$|Info\.ios\.plist$|package(-lock)?\.json$)|/phone\.rs$'
          compiled="$(printf '%s\n' "$files" | grep -Ev "$not_compiled|$phone_only" || true)"
          if [ -z "$compiled" ]; then
            pick false false
          else
            pick true false
          fi

  linux:
    name: Linux tests
    needs: platforms
    if: needs.platforms.outputs.linux == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-check

  camera-fix:
    name: Linux camera fix plugin
    needs: platforms
    if: needs.platforms.outputs.linux == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and try the plugin
        run: |
          sudo apt-get update
          sudo apt-get remove -y libunwind-14-dev
          sudo apt-get install -y --no-install-recommends gcc pkg-config libgstreamer1.0-dev gstreamer1.0-tools gstreamer1.0-plugins-base
          bash apps/desktop/src-tauri/linux/camera-fix/build.sh "$RUNNER_TEMP/camera-fix"
          bash apps/desktop/src-tauri/linux/camera-fix/check.sh "$RUNNER_TEMP/camera-fix"

  windows:
    name: Windows check
    needs: platforms
    if: needs.platforms.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-check

  macos:
    name: macOS check
    needs: platforms
    if: needs.platforms.outputs.macos == 'true'
    runs-on: commy-mac-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-check
