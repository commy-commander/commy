name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 2,5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  languages:
    name: Pick languages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          all='["actions","javascript-typescript","rust"]'
          if [ "$EVENT" != push ] || [ -z "${BEFORE//0/}" ]; then
            echo "list=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --paginate --jq '.files[].filename')"
          changed() { printf '%s\n' "$files" | grep -Eq "$1"; }
          picked=""
          changed '^\.github/(workflows|actions)/' && picked="$picked actions"
          changed '\.(js|mjs|cjs|jsx|ts|mts|cts|tsx|html)$' && picked="$picked javascript-typescript"
          changed '\.rs$|(^|/)Cargo\.(toml|lock)$' && picked="$picked rust"
          list="$(printf '%s\n' $picked | jq -Rnc '[inputs | select(length > 0)]')"
          echo "Languages to analyze: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: languages
    if: needs.languages.outputs.list != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - apps/desktop/ui/vendor

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
