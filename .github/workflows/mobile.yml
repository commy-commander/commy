name: Mobile builds

on:
  push:
    branches: [main]
    paths: &mobile-paths
      - "crates/**"
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/mobile/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths: *mobile-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=24.22.1 <25"

      - name: Mobile script tests
        run: node --test "apps/desktop/mobile/*.test.mjs"

      - name: Android SDK and NDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Generate the Android project
        working-directory: apps/desktop/src-tauri
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          npm ci
          npx tauri android init --ci
          npx tauri icon ../mobile/app-icon.png
          node ../mobile/android-project.mjs

      - name: Keep the debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE" ]; then
            mkdir -p ~/.android
            printf '%s' "$ANDROID_DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "Signing with the debug key from ANDROID_DEBUG_KEYSTORE"
          else
            echo "ANDROID_DEBUG_KEYSTORE is not set, so this APK gets a new debug key"
          fi

      - name: Build
        working-directory: apps/desktop/src-tauri
        run: |
          npx tauri android build \
            --ci --debug --apk --target aarch64 --target x86_64

      - name: Collect the APK
        run: |
          mkdir -p dist
          apk="$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)"
          [ -n "$apk" ] || { echo "no APK was built"; exit 1; }
          cp "$apk" dist/Commy-debug.apk
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commy-android-debug
          path: dist/Commy-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS simulator build
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    continue-on-error: true
    runs-on: macos-15-intel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ios
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=24.22.1 <25"

      - name: Generate the Xcode project
        working-directory: apps/desktop/src-tauri
        run: |
          npm ci
          npx tauri ios init --ci
          npx tauri icon ../mobile/app-icon.png
          grep -q "SystemConfiguration.framework" gen/apple/project.yml

      - name: Build for the simulator
        working-directory: apps/desktop/src-tauri
        run: |
          npx tauri ios build --ci --debug --target aarch64-sim \
            || echo "::notice::Archiving needs a signing team; the next step checks that the simulator app built"

      - name: Collect the app
        run: |
          app="$(find ~/Library/Developer/Xcode/DerivedData -path '*/Build/Products/debug-iphonesimulator/*.app' -prune -type d | head -n 1)"
          [ -n "$app" ] || { echo "no simulator app was built"; exit 1; }
          mkdir -p dist
          ditto -c -k --keepParent "$app" dist/Commy-simulator.zip
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commy-ios-simulator
          path: dist/Commy-simulator.zip
          if-no-files-found: error
          retention-days: 14
