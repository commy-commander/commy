name: Mobile builds

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/mobile/**"
      - "apps/desktop/ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "crates/**"
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/mobile/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
    inputs:
      ios:
        description: "iOS build: simulator app, signed IPA, or signed IPA sent to TestFlight"
        type: choice
        options: [simulator, signed, testflight]
        default: simulator
      version:
        description: "App version for signed iOS builds, e.g. 0.1.16 (prod servers) or 0.1.16-rc.1 (staging servers)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=24.22.1 <25"

      - name: Mobile script tests
        run: node --test "apps/desktop/mobile/*.test.mjs"

      - name: Android SDK and NDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Keep the debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE" ]; then
            mkdir -p ~/.android
            printf '%s' "$ANDROID_DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "ANDROID_DEBUG_KEYSTORE_FILE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
            echo "Signing with the debug key from ANDROID_DEBUG_KEYSTORE"
          else
            echo "ANDROID_DEBUG_KEYSTORE is not set, so this APK gets a new debug key"
          fi

      - name: Generate the Android project
        working-directory: apps/desktop/src-tauri
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          npm ci
          npx tauri android init --ci
          npx tauri icon ../mobile/app-icon.png
          node ../mobile/android-project.mjs

      - name: Build
        working-directory: apps/desktop/src-tauri
        run: |
          npx tauri android build \
            --ci --debug --apk --target aarch64 --target x86_64

      - name: Collect the APK
        run: |
          mkdir -p dist
          apk="$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)"
          [ -n "$apk" ] || { echo "no APK was built"; exit 1; }
          cp "$apk" dist/Commy-debug.apk
          ls -la dist

      - name: Check the APK is signed with the kept key
        if: env.ANDROID_DEBUG_KEYSTORE_FILE != ''
        run: |
          want="$(keytool -list -v -keystore "$ANDROID_DEBUG_KEYSTORE_FILE" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')"
          certs="$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs dist/Commy-debug.apk)"
          printf '%s\n' "$certs" | grep 'SHA-256' || true
          got="$(printf '%s\n' "$certs" | sed -n 's/^.*certificate SHA-256 digest: //p' | sort -u)"
          echo "kept key: $want"
          echo "APK:      $got"
          [ -n "$want" ] && [ "$want" = "$got" ] || { echo "::error::The APK is not signed with the key from ANDROID_DEBUG_KEYSTORE"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commy-android-debug
          path: dist/Commy-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS ${{ inputs.ios || 'simulator' }} build
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 90
    continue-on-error: ${{ inputs.ios == 'simulator' }}
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    env:
      IOS_MODE: ${{ inputs.ios || 'simulator' }}
      APP_VERSION_INPUT: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the signing secrets
        if: env.IOS_MODE != 'simulator'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          missing=()
          need() { [ -n "${!1}" ] || missing+=("$1"); }
          need APPLE_DEVELOPMENT_TEAM
          if [ -n "$IOS_CERTIFICATE" ]; then
            need IOS_CERTIFICATE_PASSWORD
            need IOS_MOBILE_PROVISION
            echo "Signing with the certificate and profile from IOS_CERTIFICATE and IOS_MOBILE_PROVISION"
          else
            need APPLE_API_KEY_ID
            need APPLE_API_ISSUER
            need APPLE_API_KEY
            echo "Signing automatically with the App Store Connect API key"
          fi
          if [ "$IOS_MODE" = testflight ]; then
            need APPLE_API_KEY_ID
            need APPLE_API_ISSUER
            need APPLE_API_KEY
          fi
          [[ "$APP_VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::Set the version input, e.g. 0.1.16 or 0.1.16-rc.1"; exit 1; }
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Missing repository secret %s\n' "${missing[@]}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ios-arm64
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=24.22.1 <25"

      - name: Generate the Xcode project
        working-directory: apps/desktop/src-tauri
        run: |
          npm ci
          npx tauri ios init --ci
          npx tauri icon ../mobile/app-icon.png
          grep -q "SystemConfiguration.framework" gen/apple/project.yml

      - name: Build the simulator app and an unsigned device app
        if: env.IOS_MODE == 'simulator'
        working-directory: apps/desktop/src-tauri
        run: |
          npx tauri ios build --ci --debug --no-sign --target aarch64-sim --target aarch64

      - name: Build the signed app
        if: env.IOS_MODE != 'simulator'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$ASC_KEY" ]; then
            mkdir -p ~/.appstoreconnect/private_keys
            key_path=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
            printf '%s' "$ASC_KEY" > "$key_path"
          fi
          if [ -z "$IOS_CERTIFICATE" ]; then
            unset IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION
            export APPLE_API_KEY="$ASC_KEY_ID" APPLE_API_ISSUER="$ASC_ISSUER_ID" APPLE_API_KEY_PATH="$key_path"
          else
            [ -n "$IOS_MOBILE_PROVISION" ] || unset IOS_MOBILE_PROVISION
          fi
          upload=()
          [ "$IOS_MODE" != testflight ] || upload=(--testflight)
          apps/desktop/mobile/ios-build.sh "$APP_VERSION_INPUT" "${upload[@]}"

      - name: Collect the apps
        run: |
          build=apps/desktop/src-tauri/gen/apple/build
          mkdir -p dist
          if [ "$IOS_MODE" = simulator ]; then
            app="$(find "$build" -path '*sim*' -name '*.app' -prune -type d | head -n 1)"
            [ -n "$app" ] || { echo "no simulator app was built"; exit 1; }
            ditto -c -k --keepParent "$app" dist/Commy-simulator.zip
            ipa="$(find "$build" -name '*.ipa' | head -n 1)"
            [ -n "$ipa" ] || { echo "no device app was built"; exit 1; }
            echo "Device build compiled: $ipa"
          else
            cp "$build"/Commy-*.ipa dist/
          fi
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commy-ios-${{ env.IOS_MODE }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
