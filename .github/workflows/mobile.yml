name: Mobile builds

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/apple-sign-in/**"
      - "apps/desktop/mobile/**"
      - "apps/desktop/ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "crates/**"
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/apple-sign-in/**"
      - "apps/desktop/mobile/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
    inputs:
      android:
        description: "Android build: debug APK, a Play Store bundle signed with the upload key, or none"
        type: choice
        options: [debug, play, none]
        default: debug
      ios:
        description: "iOS build: simulator app, signed IPA, signed IPA sent to TestFlight, or none"
        type: choice
        options: [simulator, signed, testflight, none]
        default: simulator
      version:
        description: "App version for Play and signed iOS builds, e.g. 0.1.16 (prod servers) or 0.1.16-rc.1 (staging servers)"
        type: string
        default: ""
      play_testing:
        description: "Google Play testing track a Play bundle goes to, or none to only keep the files"
        type: choice
        options: [internal, closed, open, none]
        default: internal

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}-{2}-{3}-{4}', github.event_name, github.ref, github.sha, inputs.android, inputs.ios) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  android:
    name: Android ${{ inputs.android == 'play' && 'Play bundle' || 'debug APK' }}
    if: inputs.android != 'none'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      ANDROID_MODE: ${{ inputs.android || 'debug' }}
      APP_VERSION_INPUT: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=24.22.1 <25"

      - name: Mobile script tests
        run: node --test "apps/desktop/mobile/*.test.mjs"

      - name: Android SDK and NDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Keep the debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE" ]; then
            mkdir -p ~/.android
            printf '%s' "$ANDROID_DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "ANDROID_DEBUG_KEYSTORE_FILE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
            echo "Signing with the debug key from ANDROID_DEBUG_KEYSTORE"
          else
            echo "ANDROID_DEBUG_KEYSTORE is not set, so this APK gets a new debug key"
          fi

      - name: Generate the Android project
        if: env.ANDROID_MODE == 'debug'
        working-directory: apps/desktop/src-tauri
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          npm ci
          npx tauri android init --ci
          npx tauri icon ../mobile/app-icon.png
          node ../mobile/android-project.mjs

      - name: Build
        if: env.ANDROID_MODE == 'debug'
        working-directory: apps/desktop/src-tauri
        run: |
          npx tauri android build \
            --ci --debug --apk --target aarch64 --target x86_64

      - name: Collect the APK
        if: env.ANDROID_MODE == 'debug'
        run: |
          mkdir -p dist
          apk="$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)"
          [ -n "$apk" ] || { echo "no APK was built"; exit 1; }
          cp "$apk" dist/Commy-debug.apk
          ls -la dist

      - name: Check the APK is signed with the kept key
        if: env.ANDROID_MODE == 'debug' && env.ANDROID_DEBUG_KEYSTORE_FILE != ''
        run: |
          want="$(keytool -list -v -keystore "$ANDROID_DEBUG_KEYSTORE_FILE" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')"
          certs="$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs dist/Commy-debug.apk)"
          printf '%s\n' "$certs" | grep 'SHA-256' || true
          got="$(printf '%s\n' "$certs" | sed -n 's/^.*certificate SHA-256 digest: //p' | sort -u)"
          echo "kept key: $want"
          echo "APK:      $got"
          [ -n "$want" ] && [ "$want" = "$got" ] || { echo "::error::The APK is not signed with the key from ANDROID_DEBUG_KEYSTORE"; exit 1; }

      - uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: env.ANDROID_MODE == 'debug'
        with:
          name: commy-android-debug
          path: dist/Commy-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build the Play bundle
        if: env.ANDROID_MODE == 'play'
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
        run: |
          export ANDROID_UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          if [ -n "$ANDROID_UPLOAD_KEYSTORE" ] && [ -n "$ANDROID_UPLOAD_PASSWORD" ]; then
            printf '%s\n' "$ANDROID_UPLOAD_KEYSTORE" | grep -av -- '-----' | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$ANDROID_UPLOAD_KEYSTORE_FILE" \
              || { echo "::error::ANDROID_UPLOAD_KEYSTORE is not valid base64 (${#ANDROID_UPLOAD_KEYSTORE} characters)"; exit 1; }
            ANDROID_UPLOAD_PASSWORD="${ANDROID_UPLOAD_PASSWORD#$'\xef\xbb\xbf'}"
            ANDROID_UPLOAD_PASSWORD="${ANDROID_UPLOAD_PASSWORD%%[$'\r\n']*}"
            echo "Upload key file: $(wc -c < "$ANDROID_UPLOAD_KEYSTORE_FILE") bytes, starts with $(head -c 4 "$ANDROID_UPLOAD_KEYSTORE_FILE" | od -An -tx1 | tr -d ' ')"
            if ! listing="$(keytool -list -keystore "$ANDROID_UPLOAD_KEYSTORE_FILE" -storepass "$ANDROID_UPLOAD_PASSWORD" 2>&1)"; then
              echo "::error::ANDROID_UPLOAD_PASSWORD does not open ANDROID_UPLOAD_KEYSTORE (${#ANDROID_UPLOAD_PASSWORD} characters): $(printf '%s' "$listing" | grep -i 'error' | head -n 1)"
              exit 1
            fi
            keytool -list -keystore "$ANDROID_UPLOAD_KEYSTORE_FILE" -storepass "$ANDROID_UPLOAD_PASSWORD" -alias commy-upload > /dev/null 2>&1 \
              || { echo "::error::ANDROID_UPLOAD_KEYSTORE has no commy-upload key; its keys are: $(printf '%s' "$listing" | grep -E 'PrivateKeyEntry|trustedCertEntry|SecretKeyEntry' | cut -d, -f1 | paste -sd ' ')"; exit 1; }
            echo "Signing with the upload key from ANDROID_UPLOAD_KEYSTORE"
          else
            ANDROID_UPLOAD_PASSWORD="$(openssl rand -hex 16)"
            echo "::add-mask::$ANDROID_UPLOAD_PASSWORD"
            keytool -genkeypair -keystore "$ANDROID_UPLOAD_KEYSTORE_FILE" -storetype PKCS12 \
              -alias commy-upload -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$ANDROID_UPLOAD_PASSWORD" -keypass "$ANDROID_UPLOAD_PASSWORD" \
              -dname "CN=Commy test key" > /dev/null
            echo "::warning::ANDROID_UPLOAD_KEYSTORE and ANDROID_UPLOAD_PASSWORD are not set, so this bundle is signed with a throwaway key and Google Play will not accept it"
          fi
          export ANDROID_UPLOAD_PASSWORD
          (cd apps/desktop/src-tauri && npm ci)
          apps/desktop/mobile/android-build.sh "$APP_VERSION_INPUT"
          mkdir -p dist
          cp apps/desktop/src-tauri/gen/android/Commy-*.aab apps/desktop/src-tauri/gen/android/Commy-*.apk dist/
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs dist/*.apk | grep 'SHA-256'
          symbols="$(unzip -l dist/*.aab | grep -c 'BUNDLE-METADATA/com.android.tools.build.debugsymbols/.*\.so' || true)"
          if [ "$symbols" -gt 0 ]; then echo "The bundle carries native debug symbols for $symbols libraries"; else echo "::warning::The bundle has no native debug symbols, so Play crash reports will show raw addresses"; fi
          unzip -p dist/*.apk lib/arm64-v8a/libcommy_desktop.so > "$RUNNER_TEMP/libcommy_desktop.so"
          echo "APK native library: $(file -b "$RUNNER_TEMP/libcommy_desktop.so" | grep -o 'not stripped\|stripped' || echo unknown), $(wc -c < "$RUNNER_TEMP/libcommy_desktop.so") bytes"
          ls -la dist

      - uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: env.ANDROID_MODE == 'play'
        with:
          name: commy-android-play
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Send the bundle to Google Play testing
        if: env.ANDROID_MODE == 'play' && inputs.play_testing != 'none'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          PLAY_TESTING: ${{ inputs.play_testing }}
          PLAY_RELEASE_NAME: ${{ inputs.version }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set, so the bundle stays in the run's files for a manual upload"
            exit 0
          fi
          if [ -z "$ANDROID_UPLOAD_KEYSTORE" ]; then
            echo "::warning::This bundle is signed with a throwaway key, so it is not sent to Google Play"
            exit 0
          fi
          case "$PLAY_RELEASE_NAME" in
            *-*)
              echo "::notice::$PLAY_RELEASE_NAME is a test build that uses the staging servers, so it is not sent to Google Play"
              exit 0
              ;;
          esac
          export PLAY_RELEASE_NOTES="Built from ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
          node apps/desktop/mobile/play-upload.mjs dist/*.aab "$PLAY_TESTING"

  ios:
    name: iOS ${{ inputs.ios || 'simulator' }} build
    if: github.event_name == 'workflow_dispatch' && inputs.ios != 'none'
    timeout-minutes: 90
    continue-on-error: ${{ inputs.ios == 'simulator' }}
    runs-on: commy-mac
    defaults:
      run:
        shell: bash
    env:
      IOS_MODE: ${{ inputs.ios || 'simulator' }}
      APP_VERSION_INPUT: ${{ inputs.version }}
    steps:
      - name: Keep the runner's home folder out of the log
        run: |
          echo "::add-mask::$HOME"
          echo "::add-mask::${HOME//\//\\/}"
          echo "::add-mask::$(basename "$HOME")"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Xcode is ready
        run: |
          xcodebuild -version
          xcodebuild -checkFirstLaunchStatus \
            || { echo "::error::Xcode on the Mac needs its first launch setup. Run 'sudo xcodebuild -runFirstLaunch' on the Mac, then run this build again"; exit 1; }

      - name: Check the signing secrets
        if: env.IOS_MODE != 'simulator'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          missing=()
          need() { [ -n "${!1}" ] || missing+=("$1"); }
          need APPLE_DEVELOPMENT_TEAM
          if [ -n "$IOS_CERTIFICATE" ]; then
            need IOS_CERTIFICATE_PASSWORD
            need IOS_MOBILE_PROVISION
            echo "Signing with the certificate and profile from IOS_CERTIFICATE and IOS_MOBILE_PROVISION"
          elif [ -n "$APPLE_API_KEY" ]; then
            need APPLE_API_KEY_ID
            need APPLE_API_ISSUER
            echo "Signing automatically with the App Store Connect API key"
          else
            echo "Signing with the Apple account added in this Mac's Xcode settings"
          fi
          if [ "$IOS_MODE" = testflight ]; then
            need APPLE_API_KEY_ID
            need APPLE_API_ISSUER
            if [ -z "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] \
              && [ ! -f ~/.appstoreconnect/private_keys/"AuthKey_${APPLE_API_KEY_ID}.p8" ]; then
              echo "::error::Put AuthKey_${APPLE_API_KEY_ID}.p8 in ~/.appstoreconnect/private_keys on the Mac, or set the APPLE_API_KEY secret"
              exit 1
            fi
          fi
          [[ "$APP_VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::Set the version input, e.g. 0.1.16 or 0.1.16-rc.1"; exit 1; }
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Missing repository secret %s\n' "${missing[@]}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: llvm-tools

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=24.22.1 <25"

      - name: Generate the Xcode project
        working-directory: apps/desktop/src-tauri
        run: |
          npm ci
          npx tauri ios init --ci
          npx tauri icon ../mobile/app-icon.png
          grep -q "SystemConfiguration.framework" gen/apple/project.yml
          ../mobile/ios-entitlements.sh
          grep -q "com.apple.developer.applesignin" gen/apple/*_iOS/*_iOS.entitlements
          grep -q "webcredentials:commy.chat" gen/apple/*_iOS/*_iOS.entitlements
          grep -q "CommyNotifications" gen/apple/*.xcodeproj/project.pbxproj

      - name: Build the simulator app and an unsigned device app
        if: env.IOS_MODE == 'simulator'
        working-directory: apps/desktop/src-tauri
        run: |
          npx tauri ios build --ci --debug --no-sign --target aarch64-sim --target aarch64

      - name: Build the signed app
        if: env.IOS_MODE != 'simulator'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$ASC_KEY" ]; then
            mkdir -p ~/.appstoreconnect/private_keys
            key_path=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
            printf '%s' "$ASC_KEY" > "$key_path"
          fi
          unset APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH
          if [ -n "$IOS_CERTIFICATE" ]; then
            [ -n "$IOS_MOBILE_PROVISION" ] || unset IOS_MOBILE_PROVISION
          else
            unset IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION
            [ -z "$ASC_KEY" ] || export APPLE_API_KEY="$ASC_KEY_ID" APPLE_API_ISSUER="$ASC_ISSUER_ID" APPLE_API_KEY_PATH="$key_path"
          fi
          [ -n "$ASC_KEY_ID" ] || unset ASC_KEY_ID ASC_ISSUER_ID
          upload=()
          [ "$IOS_MODE" != testflight ] || upload=(--testflight)
          apps/desktop/mobile/ios-build.sh "$APP_VERSION_INPUT" "${upload[@]}"

      - name: Collect the apps
        run: |
          build=apps/desktop/src-tauri/gen/apple/build
          mkdir -p dist
          if [ "$IOS_MODE" = simulator ]; then
            app="$(find "$build" -path '*sim*' -name '*.app' -prune -type d | head -n 1)"
            [ -n "$app" ] || { echo "no simulator app was built"; exit 1; }
            ditto -c -k --keepParent "$app" dist/Commy-simulator.zip
            ipa="$(find "$build" -name '*.ipa' | head -n 1)"
            [ -n "$ipa" ] || { echo "no device app was built"; exit 1; }
            echo "Device build compiled: $ipa"
          else
            cp "$build"/Commy-*.ipa dist/
          fi
          ls -la dist

      - uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: commy-ios-${{ env.IOS_MODE }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
