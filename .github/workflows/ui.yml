name: UI checks

on:
  push:
    branches: [main]
    paths: &ui-paths
      - "apps/desktop/ui/**"
      - "auth/src/media.js"
      - "apps/desktop/src-tauri/src/expressions.rs"
      - ".github/workflows/ui.yml"
  pull_request:
    paths: *ui-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check every script
        run: for f in apps/desktop/ui/scripts/*.js; do node --check "$f"; done
      - name: node --test
        run: node --test "apps/desktop/ui/tests/**/*.test.mjs"
