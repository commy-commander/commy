name: UI checks

on:
  push:
    branches: [main]
    paths: &ui-paths
      - "apps/desktop/ui/**"
      - "apps/desktop/src-tauri/src/expressions.rs"
      - "crates/commy-view/src/safety.rs"
      - "crates/commy-view/src/roles.rs"
      - "crates/commy-net/src/invite.rs"
      - "crates/commy-bot/clients/**"
      - "apps/file-store/**"
      - "deploy/releases/**"
      - "apps/desktop/src-tauri/installer/**"
      - ".github/actions/release-config/**"
      - ".github/workflows/ui.yml"
  pull_request:
    paths: *ui-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  changes:
    name: Pick UI checks
    runs-on: commy-any
    outputs:
      layout: ${{ steps.pick.outputs.layout }}
      installer: ${{ steps.pick.outputs.installer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: pick
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ -z "$BASE" ]; then
            echo "layout=true" >> "$GITHUB_OUTPUT"
            echo "installer=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "origin/$BASE...HEAD")"
          workflow='^\.github/workflows/ui\.yml$'
          touches() { [ -n "$(printf '%s\n' "$files" | grep -E "$1" | grep -Ev "$2")" ]; }
          pick() {
            echo "$1=$2" >> "$GITHUB_OUTPUT"
            echo "$1: $2"
          }
          touches "^apps/desktop/ui/|$workflow" '^apps/desktop/ui/(tests|scripts/[^/]*\.test\.)|\.md$' && pick layout true || pick layout false
          touches "^apps/desktop/src-tauri/installer/|^\.github/actions/release-config/|$workflow" '\.md$' && pick installer true || pick installer false

  test:
    name: UI tests
    runs-on: commy-any
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=24.22.1 <25"
      - name: Syntax check every script
        run: for f in apps/desktop/ui/scripts/*.js; do node --check "$f"; done
      - name: node --test
        run: node --test "apps/desktop/ui/tests/**/*.test.mjs"
      - name: Bot client tests
        run: node --test "crates/commy-bot/clients/node/*.test.mjs"
      - name: File storage worker tests
        run: node --test "apps/file-store/test/*.test.mjs"
      - name: Release publisher tests
        run: node --test "deploy/releases/*.test.mjs"

  layout:
    name: Call bar layout
    needs: changes
    if: needs.changes.outputs.layout == 'true'
    runs-on: commy-any
    defaults:
      run:
        working-directory: apps/desktop/ui/layout-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=24.22.1 <25"
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium
      - name: node --test
        run: node --test

  installer:
    name: Installer data folder page
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: commy-any
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=24.22.1 <25"
      - name: node --test
        run: node --test apps/desktop/src-tauri/installer/*.test.mjs
      - name: Compile the page
        working-directory: apps/desktop/src-tauri/installer
        run: |
          if ! command -v makensis >/dev/null; then
            [ "$RUNNER_OS" = Linux ] || { echo "makensis is missing on this runner"; exit 1; }
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends nsis
          fi
          makensis -WX -DOUTPUT="$RUNNER_TEMP/data-folder-check.exe" check-data-folder.nsi
      - name: Patch the installer template the release uses
        working-directory: apps/desktop/src-tauri
        run: |
          cli="$(sed -n 's/^  TAURI_CLI_VERSION: "\(.*\)"$/\1/p' ../../../.github/workflows/release.yml)"
          bundler="$(curl -fsSL -A commy-ci "https://crates.io/api/v1/crates/tauri-cli/${cli}/dependencies" \
            | jq -r '.dependencies[] | select(.crate_id == "tauri-bundler") | .req' | tr -d '=^~ ')"
          upstream="tauri-bundler-${bundler}/src/bundle/windows/nsis/installer.nsi"
          mkdir -p "$RUNNER_TEMP/nsis-upstream"
          curl -fsSL -A commy-ci "https://crates.io/api/v1/crates/tauri-bundler/${bundler}/download" | tar -xz -C "$RUNNER_TEMP/nsis-upstream" "$upstream"
          node installer/add-data-folder-page.mjs "$RUNNER_TEMP/nsis-upstream/$upstream" "$RUNNER_TEMP/installer.nsi"
          grep -n 'data-folder.nsh' "$RUNNER_TEMP/installer.nsi"
