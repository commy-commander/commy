name: Stream Deck plugin

on:
  push:
    branches: [main]
    paths: &plugin-paths
      - "apps/streamdeck/**"
      - "apps/desktop/ui/scripts/sound-trim.js"
      - ".github/workflows/streamdeck.yml"
  pull_request:
    paths: *plugin-paths
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/streamdeck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=24.22.1 <25"
          cache: npm
          cache-dependency-path: apps/streamdeck/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run validate
      - name: Pack
        run: |
          npm run pack
          mv dist/chat.commy.soundboard.streamDeckPlugin dist/commy-soundboard.streamDeckPlugin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commy-streamdeck-plugin
          path: apps/streamdeck/dist/commy-soundboard.streamDeckPlugin
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 90 || 7 }}
