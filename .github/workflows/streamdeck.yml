name: Stream Deck plugin

on:
  push:
    branches: [main]
    paths: &plugin-paths
      - "apps/streamdeck/**"
      - ".github/workflows/streamdeck.yml"
  pull_request:
    paths: *plugin-paths
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/streamdeck
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/streamdeck/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run validate
      - name: Pack
        run: |
          npm run pack
          mv dist/chat.commy.soundboard.streamDeckPlugin dist/commy-soundboard.streamDeckPlugin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: commy-streamdeck-plugin
          path: apps/streamdeck/dist/commy-soundboard.streamDeckPlugin
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 90 || 7 }}
