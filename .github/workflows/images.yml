name: Server images

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: &image-paths
      - "auth/**"
      - "apps/web/**"
      - "deploy/**"
      - "crates/commy-sync/**"
      - "crates/commy-sync-server/**"
      - ".dockerignore"
      - ".github/workflows/images.yml"
      - ".github/actions/test-databases/**"
      - "!deploy/*.md"
  pull_request:
    paths: *image-paths
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: git.commy.chat
  IMAGES: git.commy.chat/commy
  WEB_IMAGE_REPO: git.commy.chat/commy-private/commy-web

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Pick server checks
    runs-on: commy-any
    outputs:
      auth: ${{ steps.pick.outputs.auth }}
      sync: ${{ steps.pick.outputs.sync }}
      agent: ${{ steps.pick.outputs.agent }}
      stack: ${{ steps.pick.outputs.stack }}
      sync_host: ${{ steps.pick.outputs.sync_host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: pick
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          checks="auth sync agent stack sync_host"
          if [ -z "$BASE" ]; then
            for check in $checks; do echo "$check=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          files="$(git diff --name-only "origin/$BASE...HEAD")"
          workflow='^\.github/workflows/images\.yml$'
          sync_crates='^crates/commy-sync(-server)?/'
          databases='^\.github/actions/test-databases/'
          image_inputs="^(auth/|deploy/|\.dockerignore$)|$sync_crates|$workflow"
          not_in_stack='^apps/web/|^auth/test/|^crates/[^/]+/tests/|^deploy/(sync-host|relay|relay-host|relay-tools|releases|host|forge|forge-runner)/|\.md$'
          not_in_sync_host='/tests?/|\.md$'
          touches() { [ -n "$(printf '%s\n' "$files" | grep -E "$1")" ]; }
          touches_outside() { [ -n "$(printf '%s\n' "$files" | grep -E "$1" | grep -Ev "$2")" ]; }
          pick() {
            echo "$1=$2" >> "$GITHUB_OUTPUT"
            echo "$1: $2"
          }
          touches "^auth/|$databases|$workflow" && pick auth true || pick auth false
          touches "$sync_crates|^Cargo\.(toml|lock)$|$databases|$workflow" && pick sync true || pick sync false
          touches "^deploy/(agent/|edge/|setup-vps\.sh$)|$workflow" && pick agent true || pick agent false
          touches_outside "$image_inputs" "$not_in_stack" && pick stack true || pick stack false
          touches_outside "$sync_crates|^deploy/(sync-host|relay)/|^\.dockerignore$|$workflow" "$not_in_sync_host" && pick sync_host true || pick sync_host false

  auth-tests:
    name: Auth server tests
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    runs-on: commy-mac-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start throwaway Postgres and Redis
        run: sh .github/actions/test-databases/databases.sh start
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=24.22.1 <25"
      - run: npm ci
        working-directory: auth
      - run: npm test
        working-directory: auth
      - name: Stop the throwaway databases
        if: always()
        run: sh .github/actions/test-databases/databases.sh stop

  sync-tests:
    name: Sync service tests
    needs: changes
    if: needs.changes.outputs.sync == 'true'
    runs-on: commy-mac-ci
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Keep the build folder on this Mac between runs
        run: |
          target="$HOME/.cache/commy-ci-target/sync-tests"
          if [ -d "$target" ] && [ "$(du -sk "$target" | cut -f1)" -gt 20000000 ]; then
            echo "Clearing a build folder over 20 GB"
            rm -rf "$target"
          fi
          echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
      - name: Start a throwaway Postgres
        run: sh .github/actions/test-databases/databases.sh start
      - run: cargo test --locked -p commy-sync -p commy-sync-server --features commy-sync/client
      - name: Stop the throwaway databases
        if: always()
        run: sh .github/actions/test-databases/databases.sh stop

  agent-tests:
    name: Deploy agent tests
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -s sh deploy/agent/commy-agent.sh deploy/setup-vps.sh
      - name: Unit tests
        run: sh deploy/agent/commy-agent.test.sh
      - name: Integration tests (real Docker, local registry)
        run: sh deploy/agent/integration.test.sh
      - name: Edge proxy checks (real Caddy)
        run: |
          shellcheck -s sh deploy/edge/edge.test.sh
          sh deploy/edge/edge.test.sh

  stack-e2e:
    name: VPS setup end to end
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      STACK: commy-stack-e2e-${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - uses: ./.github/actions/registry-login
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - name: Build the sync service image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: crates/commy-sync-server/Dockerfile
          load: true
          tags: localhost:5000/commy-sync:candidate

      - name: Build the auth image and fetch the web image
        run: |
          docker build -q -f auth/Dockerfile -t localhost:5000/commy-auth:candidate .
          docker pull -q "$WEB_IMAGE_REPO:dev"
          docker tag "$WEB_IMAGE_REPO:dev" localhost:5000/commy-web:candidate

      - name: Start a throwaway Docker host
        run: |
          stale="$(docker ps -aq --filter label=commy-stack-e2e)"
          [ -z "$stale" ] || echo "$stale" | xargs docker rm -fv >/dev/null
          docker run -d --privileged --label commy-stack-e2e --name "$STACK" docker:29-dind >/dev/null
          deadline=$(( $(date +%s) + 120 ))
          until docker exec "$STACK" docker info >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "$deadline" ]; then docker logs "$STACK"; exit 1; fi
            sleep 2
          done
          docker exec "$STACK" apk add -q --no-cache curl git openssl
          docker save localhost:5000/commy-sync:candidate localhost:5000/commy-auth:candidate localhost:5000/commy-web:candidate \
            | docker exec -i "$STACK" docker load -q
          docker cp "$GITHUB_WORKSPACE" "$STACK:/srv/checkout"
          for env in prod staging dev; do docker exec "$STACK" cp -r /srv/checkout "/srv/commy-$env"; done

      - name: Push images into a local registry
        run: |
          docker exec -i "$STACK" sh -e <<'EOF'
          docker run -d --name registry -p 5000:5000 registry:2 >/dev/null
          until curl -sf -o /dev/null http://127.0.0.1:5000/v2/; do sleep 1; done
          for env in staging dev; do
            docker tag localhost:5000/commy-sync:candidate "localhost:5000/commy-sync:$env"
            docker push -q "localhost:5000/commy-sync:$env"
          done
          for svc in web auth; do
            for env in prod staging dev; do
              docker tag "localhost:5000/commy-$svc:candidate" "localhost:5000/commy-$svc:$env"
              docker push -q "localhost:5000/commy-$svc:$env"
            done
          done
          EOF

      - name: Run setup-vps.sh
        run: docker exec "$STACK" env COMMY_IMAGES=localhost:5000 AGENT_VERIFY=off sh /srv/commy-prod/deploy/setup-vps.sh commy.localhost ci@example.org

      - name: Every environment answers through the edge proxy
        run: |
          docker exec -i "$STACK" sh -e <<'EOF'
          urls=""
          for host in commy.localhost staging.commy.localhost dev.commy.localhost; do
            urls="$urls https://$host/ https://$host/.well-known/commy-auth.json https://$host/api/auth/commy/pages/render?path=%2Faccount https://$host/web"
          done
          deadline=$(( $(date +%s) + 300 ))
          while :; do
            pending=""
            for url in $urls; do
              host="${url#https://}"; host="${host%%/*}"
              code="$(curl -sk -m 5 -o /dev/null -w '%{http_code}' --resolve "$host:443:127.0.0.1" "$url" || true)"
              [ "$code" = 200 ] || pending="$pending $url($code)"
            done
            [ -z "$pending" ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then echo "FAIL - not answering after 5 minutes:$pending"; exit 1; fi
            sleep 5
          done
          for url in $urls; do echo "ok   - $url"; done
          for host in staging.commy.localhost dev.commy.localhost; do
            deadline=$(( $(date +%s) + 300 ))
            until [ "$(curl -sk -m 5 -o /dev/null -w '%{http_code}' --resolve "$host:443:127.0.0.1" "https://$host/sync/healthz" || true)" = 200 ]; do
              if [ "$(date +%s)" -ge "$deadline" ]; then echo "FAIL - https://$host/sync/healthz is not answering"; exit 1; fi
              sleep 5
            done
            echo "ok   - https://$host/sync/healthz"
            curl -sk -m 5 --resolve "$host:443:127.0.0.1" "https://$host/.well-known/commy-auth.json" | grep -q "\"sync\":\"wss://$host/sync\"" \
              && echo "ok   - $host advertises its sync service" || { echo "FAIL - $host does not advertise wss://$host/sync"; exit 1; }
          done
          if curl -sk -m 5 --resolve commy.localhost:443:127.0.0.1 https://commy.localhost/.well-known/commy-auth.json | grep -q '"sync":"'; then
            echo "FAIL - prod advertises a sync service before it is turned on"; exit 1
          fi
          echo "ok   - prod does not advertise a sync service"
          robots="$(curl -sk -m 5 -D - -o /dev/null --resolve staging.commy.localhost:443:127.0.0.1 https://staging.commy.localhost/ | grep -i x-robots-tag || true)"
          [ -n "$robots" ] && echo "ok   - staging is noindex" || { echo "FAIL - staging is missing X-Robots-Tag"; exit 1; }
          EOF

      - name: Environments cannot reach each other
        run: |
          docker exec -i "$STACK" sh <<'EOF'
          probe() {
            if docker exec "$1" wget -qO- -T 5 "http://$2:3001/healthz" >/dev/null 2>&1; then got=reachable; else got=unreachable; fi
            if [ "$got" = "$3" ]; then echo "ok   - $1 -> $2 is $got"; else echo "FAIL - $1 -> $2 is $got, expected $3"; return 1; fi
          }
          status=0
          probe commy-dev-auth-1 commy-prod-auth unreachable || status=1
          probe commy-dev-auth-1 commy-staging-auth unreachable || status=1
          probe commy-staging-auth-1 commy-prod-auth unreachable || status=1
          probe commy-prod-auth-1 commy-dev-auth unreachable || status=1
          probe commy-edge-caddy-1 commy-prod-auth reachable || status=1
          probe commy-edge-caddy-1 commy-staging-auth reachable || status=1
          probe commy-edge-caddy-1 commy-dev-auth reachable || status=1
          sync_probe() {
            if docker exec "$1" wget -qO- -T 5 "http://$2:3002/healthz" >/dev/null 2>&1; then got=reachable; else got=unreachable; fi
            if [ "$got" = "$3" ]; then echo "ok   - $1 -> $2 is $got"; else echo "FAIL - $1 -> $2 is $got, expected $3"; return 1; fi
          }
          sync_probe commy-dev-auth-1 commy-staging-sync unreachable || status=1
          sync_probe commy-staging-auth-1 commy-dev-sync unreachable || status=1
          sync_probe commy-edge-caddy-1 commy-staging-sync reachable || status=1
          sync_probe commy-edge-caddy-1 commy-dev-sync reachable || status=1
          exit $status
          EOF

      - name: Logs on failure
        if: failure()
        run: |
          docker exec -i "$STACK" sh <<'EOF'
          docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Ports}}'
          for net in commy-prod commy-staging commy-dev commy-relay; do
            docker network inspect "$net" --format '{{.Name}}: {{range .Containers}}{{.Name}} {{end}}'
          done
          for env in prod staging dev; do
            (cd "/srv/commy-$env/deploy" && docker compose ps -a && docker compose logs --tail 40)
          done
          (cd /srv/commy-prod/deploy/edge && docker compose logs --tail 40)
          EOF

      - name: Remove the throwaway Docker host
        if: always()
        run: docker rm -fv "$STACK" >/dev/null 2>&1 || true

  sync-host-e2e:
    name: Sync host setup end to end
    needs: changes
    if: needs.changes.outputs.sync_host == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOST: commy-sync-host-e2e-${{ github.run_number }}-${{ github.run_attempt }}
      CANDIDATE: localhost:5000/commy-sync:0.0.0-ci
      RELAY_CANDIDATE: localhost:5000/commy-relay:0.0.0-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - name: Build the sync service image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: crates/commy-sync-server/Dockerfile
          load: true
          tags: ${{ env.CANDIDATE }}
          build-args: COMMY_VERSION=0.0.0-ci

      - name: Build the relay image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/relay
          load: true
          tags: ${{ env.RELAY_CANDIDATE }}

      - name: Start a blank Docker host with only the image in a local registry
        run: |
          shellcheck -s sh deploy/sync-host/setup.sh
          stale="$(docker ps -aq --filter label=commy-sync-host-e2e)"
          [ -z "$stale" ] || echo "$stale" | xargs docker rm -fv >/dev/null
          docker run -d --privileged --label commy-sync-host-e2e --name "$HOST" docker:29-dind >/dev/null
          deadline=$(( $(date +%s) + 120 ))
          until docker exec "$HOST" docker info >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "$deadline" ]; then docker logs "$HOST"; exit 1; fi
            sleep 2
          done
          docker exec "$HOST" apk add -q --no-cache curl openssl
          docker save "$CANDIDATE" "$RELAY_CANDIDATE" | docker exec -i "$HOST" docker load -q
          docker exec "$HOST" mkdir -p /srv/checkout
          docker cp "$GITHUB_WORKSPACE/deploy" "$HOST:/srv/checkout/deploy"
          docker exec -i -e CANDIDATE -e RELAY_CANDIDATE "$HOST" sh -e <<'EOF'
          docker run -d --name registry -p 5000:5000 registry:2 >/dev/null
          until curl -sf -o /dev/null http://127.0.0.1:5000/v2/; do sleep 1; done
          for image in "$CANDIDATE" "$RELAY_CANDIDATE"; do
            docker push -q "$image" >/dev/null
            docker rmi -f "$image" >/dev/null
          done
          EOF

      - name: Set up a sync host with setup.sh and no questions
        run: |
          docker exec "$HOST" env COMMY_BUNDLE=/srv/checkout/deploy COMMY_IMAGES=localhost:5000 COMMY_VERIFY=off COMMY_VERSION=0.0.0-ci \
            sh /srv/checkout/deploy/sync-host/setup.sh --domain sync.localhost --email ci@example.org --contact abuse@example.org --yes

      - name: Running it again keeps the settings and the data
        run: |
          docker exec -i "$HOST" sh -e <<'EOF'
          before="$(grep '^POSTGRES_PASSWORD=' /srv/commy-sync/.env)"
          COMMY_BUNDLE=/srv/checkout/deploy COMMY_IMAGES=localhost:5000 COMMY_VERIFY=off COMMY_VERSION=0.0.0-ci sh /srv/commy-sync/setup.sh --yes
          after="$(grep '^POSTGRES_PASSWORD=' /srv/commy-sync/.env)"
          [ "$before" = "$after" ] && echo "ok   - the database password survived the update" || { echo "FAIL - the database password changed"; exit 1; }
          [ "$(stat -c %a /srv/commy-sync/.env)" = 600 ] && echo "ok   - .env is private" || { echo "FAIL - .env is not 0600"; exit 1; }
          grep -qx 'SYNC_ABUSE_CONTACT=abuse@example.org' /srv/commy-sync/.env && echo "ok   - the abuse contact was kept" || { echo "FAIL - the abuse contact was lost"; exit 1; }
          grep -q '^SYNC_IMAGE=localhost:5000/commy-sync@sha256:' /srv/commy-sync/.env && echo "ok   - the image is pinned by digest" || { echo "FAIL - the image is not pinned"; exit 1; }
          if COMMY_BUNDLE=/srv/checkout/deploy COMMY_VERSION=nonsense sh /srv/commy-sync/setup.sh --yes >/dev/null 2>&1; then
            echo "FAIL - a bad version was accepted"; exit 1
          fi
          echo "ok   - a bad version is refused"
          EOF

      - name: The admin page signs in, reports health and swaps certificates
        run: |
          docker exec -i "$HOST" sh -e <<'EOF'
          COMMY_BUNDLE=/srv/checkout/deploy COMMY_IMAGES=localhost:5000 COMMY_VERIFY=off COMMY_VERSION=0.0.0-ci sh /srv/commy-sync/setup.sh --yes --admin
          password="$(sed -n 's/^SYNC_ADMIN_PASSWORD=//p' /srv/commy-sync/.env)"
          [ "${#password}" -ge 32 ] && echo "ok   - setup made an admin password" || { echo "FAIL - no admin password"; exit 1; }
          admin=http://127.0.0.1:8790
          jar="$(mktemp)"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: sync.localhost' "$admin/")" = 421 ] && echo "ok   - only loopback names reach it" || { echo "FAIL - a public name reached the admin page"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H "Origin: $admin" --data-urlencode 'password=wrong' "$admin/sign-in")" = 401 ] && echo "ok   - a wrong password is refused" || { echo "FAIL - a wrong password was accepted"; exit 1; }
          curl -fs -o /dev/null -c "$jar" -H "Origin: $admin" --data-urlencode "password=$password" "$admin/sign-in"
          page="$(curl -fs -b "$jar" "$admin/")"
          for shown in 'Release 0.0.0-ci' 'Caddy Local Authority' 'abuse@example.org' 'https://sync.localhost'; do
            echo "$page" | grep -qF "$shown" && echo "ok   - the dashboard shows $shown" || { echo "FAIL - the dashboard lacks $shown"; exit 1; }
          done
          [ "$(echo "$page" | grep -o 'Not answering' | wc -l)" = 0 ] && echo "ok   - the database and relay answer" || { echo "FAIL - something is not answering"; exit 1; }
          cd "$(mktemp -d)"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout own.key -out own.crt -days 30 \
            -subj '/O=Commy CI Own Certificate/CN=sync.localhost' -addext subjectAltName=DNS:sync.localhost 2>/dev/null
          served() { echo | openssl s_client -connect 127.0.0.1:443 -servername sync.localhost 2>/dev/null | sed -n 's/^issuer=//p'; }
          [ "$(curl -s -o /dev/null -w '%{redirect_url}' -b "$jar" -H "Origin: $admin" --data-urlencode certificate@own.crt --data-urlencode key@own.key "$admin/certificate")" = "$admin/?done=certificate" ]
          served | grep -q 'Commy CI Own Certificate' && echo "ok   - Caddy serves an uploaded certificate" || { echo "FAIL - Caddy still serves $(served)"; exit 1; }
          deadline=$(( $(date +%s) + 60 ))
          until (cd /srv/commy-sync && docker compose exec -T relay sh -c 'test "$(sha256sum </custom-tls/custom.crt)" = "$(sha256sum </run/relay-tls/cert.pem)"' </dev/null); do
            [ "$(date +%s)" -lt "$deadline" ] || { echo "FAIL - the relay kept its old certificate"; exit 1; }
            sleep 3
          done
          echo "ok   - the relay switched to the uploaded certificate"
          if docker run --rm --network commy-sync_edge alpine:3.22 wget -q -T 3 -O /dev/null http://caddy:2019/config/ 2>/dev/null; then
            echo "FAIL - Caddy's admin listens on the edge network"; exit 1
          fi
          echo "ok   - Caddy's admin listens on the control network only"
          curl -fs -o /dev/null -b "$jar" -H "Origin: $admin" -X POST "$admin/certificate/automatic"
          served | grep -q 'Caddy Local Authority' && echo "ok   - back to automatic certificates" || { echo "FAIL - still serving $(served)"; exit 1; }
          COMMY_BUNDLE=/srv/checkout/deploy COMMY_IMAGES=localhost:5000 COMMY_VERIFY=off COMMY_VERSION=0.0.0-ci sh /srv/commy-sync/setup.sh --yes --no-admin >/dev/null
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$admin/")" = 000 ] && echo "ok   - --no-admin closes the admin page" || { echo "FAIL - the admin page is still open"; exit 1; }
          EOF

      - name: Logs on failure
        if: failure()
        run: docker exec "$HOST" sh -c 'cd /srv/commy-sync && docker compose ps -a && docker compose logs --tail 60' || true

      - name: Remove the throwaway Docker host
        if: always()
        run: docker rm -fv "$HOST" >/dev/null 2>&1 || true

  sync-image:
    name: sync image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Clear other containers off the runner
        if: runner.os == 'Linux'
        shell: sh
        run: |
          docker info >/dev/null 2>&1 || exit 0
          me="$(grep -o 'containers/[0-9a-f]\{64\}' /proc/self/mountinfo | head -n 1 | cut -d/ -f2)"
          [ -n "$me" ] || { echo "could not tell which container this job runs in"; exit 1; }
          for id in $(docker ps -aq --no-trunc); do
            [ "$id" = "$me" ] && continue
            docker rm -f "$id" >/dev/null
            echo "removed a container left on the runner: $id"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: ./.github/actions/registry-login
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGES }}/commy-sync
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: crates/commy-sync-server/Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          build-args: COMMY_VERSION=${{ steps.meta.outputs.version }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name={0}/commy-sync,push-by-digest=true,name-canonical=true,push=true', env.IMAGES) }}
          cache-from: |
            type=registry,ref=${{ env.IMAGES }}/commy-sync:buildcache
            ${{ github.event_name == 'pull_request' && 'type=gha,scope=pr-sync' || '' }}
          cache-to: ${{ github.event_name == 'pull_request' && 'type=gha,mode=max,scope=pr-sync' || format('type=registry,ref={0}/commy-sync:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true', env.IMAGES) }}

  relay-image:
    name: relay image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Clear other containers off the runner
        if: runner.os == 'Linux'
        shell: sh
        run: |
          docker info >/dev/null 2>&1 || exit 0
          me="$(grep -o 'containers/[0-9a-f]\{64\}' /proc/self/mountinfo | head -n 1 | cut -d/ -f2)"
          [ -n "$me" ] || { echo "could not tell which container this job runs in"; exit 1; }
          for id in $(docker ps -aq --no-trunc); do
            [ "$id" = "$me" ] && continue
            docker rm -f "$id" >/dev/null
            echo "removed a container left on the runner: $id"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: ./.github/actions/registry-login
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGES }}/commy-relay
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/relay
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name={0}/commy-relay,push-by-digest=true,name-canonical=true,push=true', env.IMAGES) }}
          cache-from: |
            type=registry,ref=${{ env.IMAGES }}/commy-relay:buildcache
            ${{ github.event_name == 'pull_request' && 'type=gha,scope=pr-relay' || '' }}
          cache-to: ${{ github.event_name == 'pull_request' && 'type=gha,mode=max,scope=pr-relay' || format('type=registry,ref={0}/commy-relay:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true', env.IMAGES) }}

  image:
    name: ${{ matrix.service }} image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      auth-digest: ${{ steps.build.outputs.digest }}
    strategy:
      fail-fast: false
      matrix:
        service: [auth]
    steps:
      - name: Clear other containers off the runner
        if: runner.os == 'Linux'
        shell: sh
        run: |
          docker info >/dev/null 2>&1 || exit 0
          me="$(grep -o 'containers/[0-9a-f]\{64\}' /proc/self/mountinfo | head -n 1 | cut -d/ -f2)"
          [ -n "$me" ] || { echo "could not tell which container this job runs in"; exit 1; }
          for id in $(docker ps -aq --no-trunc); do
            [ "$id" = "$me" ] && continue
            docker rm -f "$id" >/dev/null
            echo "removed a container left on the runner: $id"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: ./.github/actions/registry-login
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGES }}/commy-${{ matrix.service }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          build-args: COMMY_VERSION=${{ steps.meta.outputs.version }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name={0}/commy-{1},push-by-digest=true,name-canonical=true,push=true', env.IMAGES, matrix.service) }}
          cache-from: |
            type=registry,ref=${{ env.IMAGES }}/commy-${{ matrix.service }}:buildcache
            ${{ github.event_name == 'pull_request' && format('type=gha,scope=pr-{0}', matrix.service) || '' }}
          cache-to: ${{ github.event_name == 'pull_request' && format('type=gha,mode=max,scope=pr-{0}', matrix.service) || format('type=registry,ref={0}/commy-{1}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true', env.IMAGES, matrix.service) }}

  tagged-from-main:
    name: Tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.ref_type == 'tag'
        with:
          fetch-depth: 0

      - name: Refuse a tag that main does not contain
        if: github.ref_type == 'tag'
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF points at a commit that is not on main"; exit 1; }

  publish:
    name: Publish ${{ matrix.service }}
    needs: [changes, tagged-from-main, auth-tests, sync-tests, agent-tests, stack-e2e, sync-host-e2e, image, sync-image, relay-image]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ matrix.service }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [auth, sync, relay]
    steps:
      - name: Clear other containers off the runner
        if: runner.os == 'Linux'
        shell: sh
        run: |
          docker info >/dev/null 2>&1 || exit 0
          me="$(grep -o 'containers/[0-9a-f]\{64\}' /proc/self/mountinfo | head -n 1 | cut -d/ -f2)"
          [ -n "$me" ] || { echo "could not tell which container this job runs in"; exit 1; }
          for id in $(docker ps -aq --no-trunc); do
            [ "$id" = "$me" ] && continue
            docker rm -f "$id" >/dev/null
            echo "removed a container left on the runner: $id"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: ./.github/actions/registry-login
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGES }}/commy-${{ matrix.service }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=staging,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-test') }}
          flavor: latest=false

      - name: Tag the tested image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ env.IMAGES }}/commy-${{ matrix.service }}@${{ matrix.service == 'sync' && needs.sync-image.outputs.digest || matrix.service == 'relay' && needs.relay-image.outputs.digest || needs.image.outputs.auth-digest }}
          DEV_IMAGE: ${{ env.IMAGES }}/commy-${{ matrix.service }}:dev
        run: |
          newest=true
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            on_dev="$(docker buildx imagetools inspect "$DEV_IMAGE" --format '{{json .Image}}' 2>/dev/null | grep -oE '"org.opencontainers.image.revision": *"[0-9a-f]+"' | head -n 1 | cut -d'"' -f4 || true)"
            git fetch -q origin main
            if [ -n "$on_dev" ] && [ "$on_dev" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$on_dev" 2>/dev/null; then
              newest=false
              echo ":dev already has $on_dev, which includes this commit"
            fi
          fi
          args=""
          for tag in $TAGS; do
            case "$tag" in *:dev) [ "$newest" = true ] || continue ;; esac
            args="$args --tag $tag"
          done
          [ -n "$args" ] || { echo "No tags for $GITHUB_REF"; exit 0; }
          # shellcheck disable=SC2086
          docker buildx imagetools create $args "$IMAGE"
          docker buildx imagetools inspect "$IMAGE"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: matrix.service != 'auth' && startsWith(github.ref, 'refs/tags/v')
        with:
          cosign-release: v2.6.1

      - name: Sign the release's ${{ matrix.service }} image for self-hosters
        if: matrix.service != 'auth' && startsWith(github.ref, 'refs/tags/v')
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ matrix.service == 'sync' && needs.sync-image.outputs.digest || needs.relay-image.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: |
          [ -n "$COSIGN_KEY" ] || { echo "The COSIGN_PRIVATE_KEY secret is not set"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          repo="$IMAGES/commy-$SERVICE"
          cosign sign --yes --key env://COSIGN_KEY -a "release=$version" "$repo@$DIGEST"
          cosign verify -a "release=$version" --key deploy/agent/cosign.pub "$repo:$version" >/dev/null
          case "$version" in
            *-*) echo "$version is a pre-release, so :stable stays where it is" ;;
            *) docker buildx imagetools create --tag "$repo:stable" "$repo@$DIGEST" ;;
          esac
          echo "- \`commy-$SERVICE:$version\` (\`$DIGEST\`) signed with \`release=$version\` by the key in deploy/agent/cosign.pub" >> "$GITHUB_STEP_SUMMARY"
