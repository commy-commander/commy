# Builds the auth server image and publishes it to GHCR.
#   push to main   -> :dev and :sha-<commit>   (dev environment updates itself)
#   tag v1.2.3     -> :1.2.3 and :staging       (staging updates itself)
#   pull request   -> build only
# The image builds alongside the tests and is pushed by digest only; the tags above
# are added in the last job once every test passes, so nothing untested is tagged.
# Merges in a row build side by side; Publish runs one at a time and moves :dev
# only for the newest commit on main, so an older run never wins.
# Production is updated by the "Promote images" workflow. See deploy/DEPLOYING.md.
# The website image is built the same way from its own repository, commy-web.

name: Server images

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["auth/**", "deploy/**", ".github/workflows/images.yml"]
  pull_request:
    paths: ["auth/**", "deploy/**", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; main and tags never wait here
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  auth-tests:
    name: Auth server tests
    runs-on: ubuntu-latest
    # The Redis-backed doorbell and rate-limit tests run against a real Redis
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auth/package-lock.json
      - run: npm ci
        working-directory: auth
      - run: npm test
        working-directory: auth

  agent-tests:
    name: Deploy agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: shellcheck -s sh deploy/agent/commy-agent.sh deploy/setup-vps.sh
      - name: Unit tests
        run: sh deploy/agent/commy-agent.test.sh
      - name: Integration tests (real Docker, local registry)
        run: sh deploy/agent/integration.test.sh
      - name: Edge proxy checks (real Caddy)
        run: |
          shellcheck -s sh deploy/edge/edge.test.sh
          sh deploy/edge/edge.test.sh

  stack-e2e:
    name: VPS setup end to end
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build images into a local registry
        run: |
          docker run -d --name registry -p 5000:5000 registry:2
          # The auth image is built from this checkout; the website comes from its
          # own repository, so its published image stands in for it here.
          docker build -q -t "localhost:5000/commy-auth:candidate" auth
          docker pull -q ghcr.io/commy-commander/commy-web:dev
          docker tag ghcr.io/commy-commander/commy-web:dev localhost:5000/commy-web:candidate
          for svc in web auth; do
            for env in prod staging dev; do
              docker tag "localhost:5000/commy-$svc:candidate" "localhost:5000/commy-$svc:$env"
              docker push -q "localhost:5000/commy-$svc:$env"
            done
          done

      - name: Run setup-vps.sh
        run: |
          for env in prod staging dev; do sudo cp -r "$GITHUB_WORKSPACE" "/srv/commy-$env"; done
          sudo COMMY_IMAGES=localhost:5000 AGENT_VERIFY=off sh deploy/setup-vps.sh commy.localhost ci@example.org

      - name: Every environment answers through the edge proxy
        run: |
          urls=""
          for host in commy.localhost staging.commy.localhost dev.commy.localhost; do
            urls="$urls https://$host/ https://$host/.well-known/commy-auth.json"
          done
          deadline=$(( $(date +%s) + 300 ))
          while :; do
            pending=""
            for url in $urls; do
              host="${url#https://}"; host="${host%%/*}"
              code="$(curl -sk -m 5 -o /dev/null -w '%{http_code}' --resolve "$host:443:127.0.0.1" "$url" || true)"
              [ "$code" = 200 ] || pending="$pending $url($code)"
            done
            [ -z "$pending" ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then echo "FAIL - not answering after 5 minutes:$pending"; exit 1; fi
            sleep 5
          done
          for url in $urls; do echo "ok   - $url"; done
          robots="$(curl -sk -m 5 -D - -o /dev/null --resolve staging.commy.localhost:443:127.0.0.1 https://staging.commy.localhost/ | grep -i x-robots-tag || true)"
          [ -n "$robots" ] && echo "ok   - staging is noindex" || { echo "FAIL - staging is missing X-Robots-Tag"; exit 1; }

      - name: Environments cannot reach each other
        run: |
          probe() {
            if docker exec "$1" wget -qO- -T 5 "http://$2:3001/healthz" >/dev/null 2>&1; then got=reachable; else got=unreachable; fi
            if [ "$got" = "$3" ]; then echo "ok   - $1 -> $2 is $got"; else echo "FAIL - $1 -> $2 is $got, expected $3"; return 1; fi
          }
          status=0
          probe commy-dev-auth-1 commy-prod-auth unreachable || status=1
          probe commy-dev-auth-1 commy-staging-auth unreachable || status=1
          probe commy-staging-auth-1 commy-prod-auth unreachable || status=1
          probe commy-prod-auth-1 commy-dev-auth unreachable || status=1
          probe commy-edge-caddy-1 commy-prod-auth reachable || status=1
          probe commy-edge-caddy-1 commy-staging-auth reachable || status=1
          probe commy-edge-caddy-1 commy-dev-auth reachable || status=1
          exit $status

      - name: Logs on failure
        if: failure()
        run: |
          docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Ports}}'
          for net in commy-prod commy-staging commy-dev commy-relay; do
            docker network inspect "$net" --format '{{.Name}}: {{range .Containers}}{{.Name}} {{end}}'
          done
          for env in prod staging dev; do
            (cd "/srv/commy-$env/deploy" && sudo docker compose ps -a && sudo docker compose logs --tail 40)
          done
          (cd /srv/commy-prod/deploy/edge && sudo docker compose logs --tail 40)

  image:
    name: ${{ matrix.service }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      auth-digest: ${{ steps.build.outputs.digest }}
    strategy:
      fail-fast: false
      matrix:
        service: [auth]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/commy-${{ matrix.service }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only

      # Pushed untagged: the agents only follow tags, which "Publish" adds below
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.service }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name=ghcr.io/{0}/commy-{1},push-by-digest=true,name-canonical=true,push=true', github.repository_owner, matrix.service) }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  publish:
    name: Publish ${{ matrix.service }}
    needs: [auth-tests, agent-tests, stack-e2e, image]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ matrix.service }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [auth]
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/commy-${{ matrix.service }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=staging,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-test') }}
          flavor: latest=false

      - name: Tag the tested image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/commy-${{ matrix.service }}@${{ needs.image.outputs[format('{0}-digest', matrix.service)] }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A newer commit on main publishes :dev itself; this one keeps only its sha- tag
          newest=true
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            [ "$head" = "$GITHUB_SHA" ] || { newest=false; echo "main is now at $head, leaving :dev to that run"; }
          fi
          args=""
          for tag in $TAGS; do
            case "$tag" in *:dev) [ "$newest" = true ] || continue ;; esac
            args="$args --tag $tag"
          done
          [ -n "$args" ] || { echo "No tags for $GITHUB_REF"; exit 0; }
          # shellcheck disable=SC2086
          docker buildx imagetools create $args "$IMAGE"
          docker buildx imagetools inspect "$IMAGE"
