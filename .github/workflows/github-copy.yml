name: Copy releases to GitHub

on:
  release:
    types: [published, edited]
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-copy
  cancel-in-progress: false

jobs:
  copy:
    name: Copy new and changed releases
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Clear other containers off the runner
        if: runner.os == 'Linux'
        shell: sh
        run: |
          docker info >/dev/null 2>&1 || exit 0
          me="$(grep -o 'containers/[0-9a-f]\{64\}' /proc/self/mountinfo | head -n 1 | cut -d/ -f2)"
          [ -n "$me" ] || { echo "could not tell which container this job runs in"; exit 1; }
          for id in $(docker ps -aq --no-trunc); do
            [ "$id" = "$me" ] && continue
            docker rm -f "$id" >/dev/null
            echo "removed a container left on the runner: $id"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Copy new and changed releases
        env:
          FORGE_TOKEN: ${{ github.token }}
          MIRROR_GITHUB_TOKEN: ${{ secrets.MIRROR_GITHUB_TOKEN }}
        run: node deploy/releases/github-copy.mjs
