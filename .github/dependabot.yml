version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - /auth
      - /deploy/relay-tools
      - /apps/streamdeck
      - /apps/desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      npm-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: libc
        versions: ["0.2.190", "0.2.191"]
  - package-ecosystem: docker
    directories:
      - /auth
      - /deploy/agent
      - /deploy/relay
      - /deploy/relay-tools
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directories:
      - /deploy
      - /deploy/edge
    schedule:
      interval: weekly
