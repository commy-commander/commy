[workspace]
resolver = "2"
members = [
    "crates/commy-core",
    "crates/commy-net",
    "crates/commy-audio",
    "crates/commy-media",
    "crates/commy-bot",
    "crates/commy-view",
    "apps/desktop/src-tauri",
    "apps/web",
    "crates/commy-sync",
    "crates/commy-sync-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/commy-commander/commy"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
postcard = { version = "1", features = ["alloc"] }
data-encoding = "2"
aes-gcm = "0.11"
tracing = "0.1"

iroh = "1.4"
iroh-gossip = "0.101"
iroh-blobs = "0.103"

commy-core = { path = "crates/commy-core" }
commy-net = { path = "crates/commy-net" }
commy-view = { path = "crates/commy-view" }
commy-audio = { path = "crates/commy-audio" }
commy-media = { path = "crates/commy-media" }
commy-sync = { path = "crates/commy-sync" }

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.commy-media]
opt-level = 3

[profile.dev.package.commy-audio]
opt-level = 3
