services:
  relay:
    volumes:
      - edge_caddy_data:/caddy-data:ro

  relay-proxy:
    networks:
      edge:
      public:
        aliases: ["${RELAY_PROXY_ALIAS:-commy-relay-proxy}"]

networks:
  public:
    external: true
    name: commy-relay

volumes:
  edge_caddy_data:
    external: true
    name: commy-edge_caddy_data
