# Runs only the iroh relay beside the shared deploy/edge proxy when dev, staging
# and prod share a server. Uses the same deploy/.env. Production relay, from the
# prod checkout (relay.<domain>, STUN 3478/udp):
#   docker compose -p commy-relay -f docker-compose.yml -f docker-compose.relay.yml \
#     up -d --build relay relay-proxy relay-meter
# Staging relay for test builds, from the staging checkout (relay-staging.<domain>,
# STUN 3479/udp, a smaller monthly budget):
#   RELAY_PROXY_ALIAS=commy-relay-staging-proxy STUN_PORT=3479 RELAY_MONTHLY_LIMIT_GB=500 \
#     docker compose -p commy-relay-staging -f docker-compose.yml -f docker-compose.relay.yml \
#     up -d --build relay relay-proxy relay-meter
# deploy/edge serves both names on port 8443 and forwards to the matching alias.

services:
  relay-proxy:
    networks:
      edge:
      public:
        aliases: ["${RELAY_PROXY_ALIAS:-commy-relay-proxy}"]

networks:
  public:
    external: true
    name: commy-relay
