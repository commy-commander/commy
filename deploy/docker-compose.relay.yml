services:
  relay:
    volumes:
      - edge_caddy_data:/caddy-data:ro

  relay-proxy:
    networks:
      edge:
      public:
        aliases: ["${RELAY_PROXY_ALIAS:-commy-relay-proxy}"]

  relay-access:
    networks:
      edge:
      accounts:
      test-accounts:

networks:
  edge:
    enable_ipv6: true
    ipam:
      config:
        - subnet: ${RELAY_IPV6_SUBNET:-fd99:6513:f442:1::/64}
  public:
    external: true
    name: commy-relay
  accounts:
    external: true
    name: ${RELAY_ACCOUNTS_NETWORK:-commy-relay}
  test-accounts:
    external: true
    name: ${RELAY_TEST_ACCOUNTS_NETWORK:-commy-relay}

volumes:
  edge_caddy_data:
    external: true
    name: commy-edge_caddy_data
