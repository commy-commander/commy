# Runs this stack as one environment (dev, staging or prod) behind the shared
# edge proxy in deploy/edge instead of its own Caddy. Requires COMPOSE_PROJECT_NAME
# in .env (commy-dev, commy-staging or commy-prod). See DEPLOYING.md.
# Aliases rather than container names, so the agent can run old and new side by side.

services:
  caddy:
    # Disabled: deploy/edge terminates TLS for every environment
    profiles: ["single-host"]

  web:
    environment:
      AUTH_INTERNAL_URL: http://${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME in .env}-auth:3001
    networks:
      edge:
      public:
        aliases: ["${COMPOSE_PROJECT_NAME}-web"]

  auth:
    networks:
      edge:
        aliases: ["${COMPOSE_PROJECT_NAME}-auth"]
      db:
      public:
        aliases: ["${COMPOSE_PROJECT_NAME}-auth"]

networks:
  public:
    external: true
    name: commy-public
