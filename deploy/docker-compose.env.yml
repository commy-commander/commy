services:
  caddy:
    profiles: ["single-host"]

  relay:
    profiles: ["single-host"]

  relay-proxy:
    profiles: ["single-host"]

  relay-meter:
    profiles: ["single-host"]

  web:
    environment:
      AUTH_INTERNAL_URL: http://${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME in .env}-auth:3001
    networks:
      edge:
      public:
        aliases: ["${COMPOSE_PROJECT_NAME}-web"]

  auth:
    networks:
      edge:
        aliases: ["${COMPOSE_PROJECT_NAME}-auth"]
      db:
      public:
        aliases: ["${COMPOSE_PROJECT_NAME}-auth"]

  sync:
    networks:
      edge:
      db:
      public:
        aliases: ["${COMPOSE_PROJECT_NAME}-sync"]

networks:
  public:
    external: true
    name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME in .env}
