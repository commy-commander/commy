name: commy-relay-host

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    pids_limit: 512
    mem_limit: ${CADDY_MEM_LIMIT:-256m}
    ports:
      - "80:80"
      - "8443:8443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN in .env}
      STAGING_RELAY_DOMAIN: ${STAGING_RELAY_DOMAIN:?set STAGING_RELAY_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [relay]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  relay:
    name: commy-relay

volumes:
  caddy_data:
    name: commy-edge_caddy_data
  caddy_config:
