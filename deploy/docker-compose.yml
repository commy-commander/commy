name: commy

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  pids_limit: 256

services:
  caddy:
    <<: *hardened
    cap_add: [NET_BIND_SERVICE]
    mem_limit: ${CADDY_MEM_LIMIT:-512m}
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
      - "${RELAY_HTTPS_PORT:-8443}:8443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      DOCS_DOMAIN: ${DOCS_DOMAIN:-docs.${DOMAIN}}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      RELAY_DOMAIN: ${RELAY_DOMAIN:-relay.${DOMAIN}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      auth:
        condition: service_healthy
    networks: [edge]
    logging: *logging

  web:
    <<: *hardened
    mem_limit: ${WEB_MEM_LIMIT:-1g}
    image: ${WEB_IMAGE:-git.commy.chat/commy-private/commy-web:prod}
    restart: unless-stopped
    environment:
      AUTH_INTERNAL_URL: http://auth:3001
      PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN}}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ACCESS_CODE: ${ACCESS_CODE:-}
      COMMY_RELAY_URLS: ${COMMY_RELAY_URLS:-}
    depends_on:
      auth:
        condition: service_healthy
    networks: [edge]
    logging: *logging

  auth:
    <<: *hardened
    mem_limit: ${AUTH_MEM_LIMIT:-768m}
    build:
      context: ..
      dockerfile: auth/Dockerfile
    image: ${AUTH_IMAGE:-commy-auth:local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://commy:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/commy_auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${PUBLIC_URL:-https://${DOMAIN}}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      COMMY_INSTANCE_NAME: ${COMMY_INSTANCE_NAME:-Commy}
      COMMY_LOGO_URL: ${COMMY_LOGO_URL:-}
      COMMY_HOME_URL: ${COMMY_HOME_URL:-}
      COMMY_TERMS_URL: ${COMMY_TERMS_URL:-}
      COMMY_PRIVACY_URL: ${COMMY_PRIVACY_URL:-}
      COMMY_DOWNLOAD_URL: ${COMMY_DOWNLOAD_URL:-}
      COMMY_RELAY_URLS: ${COMMY_RELAY_URLS:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      ACCESS_CODE: ${ACCESS_CODE:-}
      ADULTS_ONLY: ${ADULTS_ONLY:-true}
      BLOCK_THROWAWAY_EMAILS: ${BLOCK_THROWAWAY_EMAILS:-true}
      TERMS_VERSION: ${TERMS_VERSION:-2026-10-25}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      APPLE_APP_BUNDLE_IDS: ${APPLE_APP_BUNDLE_IDS:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      IOS_APP_IDS: ${IOS_APP_IDS:-}
      ANDROID_APP_PACKAGE: ${ANDROID_APP_PACKAGE:-}
      ANDROID_APP_CERT_SHA256: ${ANDROID_APP_CERT_SHA256:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_POSTAL_ADDRESS: ${EMAIL_POSTAL_ADDRESS:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      INVITES_REQUIRE_ACCOUNT: ${INVITES_REQUIRE_ACCOUNT:-false}
      INVITES_MAX_PERMANENT: ${INVITES_MAX_PERMANENT:-}
      KLIPY_API_KEY: ${KLIPY_API_KEY:-}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      DOORBELL: ${DOORBELL:-true}
      SYNC_URL: ${SYNC_URL:-}
      RELAY_ACCESS_TOKEN: ${RELAY_ACCESS_TOKEN:-}
      LINK_BLOCKLIST_URLS: ${LINK_BLOCKLIST_URLS:-}
      AUTH_SERVER_KEY: ${AUTH_SERVER_KEY:-}
      COMMY_LIST_KEY: ${COMMY_LIST_KEY:-}
      COMMY_ABUSE_CONTACT: ${COMMY_ABUSE_CONTACT:-}
      LISTING: ${LISTING:-off}
      LISTING_REVIEW_EMAIL: ${LISTING_REVIEW_EMAIL:-}
      LISTING_OLDEST_VERSION: ${LISTING_OLDEST_VERSION:-}
      SERVER_BLOCKLIST_FILE: /srv/server-blocklist/servers.txt
      REDIS_URL: ${REDIS_URL-redis://redis:6379}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - ${SERVER_BLOCKLIST_DIR:-./server-blocklist}:/srv/server-blocklist:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [edge, db]
    logging: *logging

  sync:
    <<: *hardened
    mem_limit: ${SYNC_MEM_LIMIT:-384m}
    build:
      context: ..
      dockerfile: crates/commy-sync-server/Dockerfile
    image: ${SYNC_IMAGE:-commy-sync:local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://commy:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/commy_sync
      SYNC_RETENTION_DAYS: ${SYNC_RETENTION_DAYS:-90}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      APNS_KEY: ${APNS_KEY:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      SYNC_ABUSE_CONTACT: ${SYNC_ABUSE_CONTACT:-}
      SYNC_OPERATOR_NAME: ${SYNC_OPERATOR_NAME:-${COMMY_INSTANCE_NAME:-}}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SYNC_PUSH_GATEWAY: ${SYNC_PUSH_GATEWAY:-off}
      SYNC_PUSH_VIA: ${SYNC_PUSH_VIA:-off}
      SYNC_DOMAIN: ${DOMAIN}
      SYNC_GATEWAY_DAILY_BUDGET: ${SYNC_GATEWAY_DAILY_BUDGET:-100000}
      SYNC_GATEWAY_ALERT_PERCENT: ${SYNC_GATEWAY_ALERT_PERCENT:-75}
      SYNC_GATEWAY_BLOCKLIST: ${SYNC_GATEWAY_BLOCKLIST:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      RUST_LOG: ${SYNC_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [edge, db]
    logging: *logging

  relay:
    <<: *hardened
    mem_limit: ${RELAY_MEM_LIMIT:-512m}
    build: ./relay
    image: ${RELAY_IMAGE:-commy-relay:iroh-relay-1.4.1}
    restart: unless-stopped
    cap_add: [SETUID, SETGID, KILL]
    ports:
      - "${RELAY_QAD_PORT:-7842}:7842/udp"
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:-relay.${DOMAIN}}
      RELAY_ACCESS_URL: ${RELAY_ACCESS_URL:-}
    volumes:
      - relay_flags:/flags:ro
      - caddy_data:/caddy-data:ro
    networks: [edge]
    depends_on: [relay-access]
    logging: *logging

  relay-proxy:
    <<: *hardened
    mem_limit: 256m
    build: ./relay-tools
    image: ${RELAY_TOOLS_IMAGE:-commy-relay-tools:local}
    restart: unless-stopped
    command: ["node", "proxy.mjs"]
    volumes:
      - relay_flags:/flags:ro
    depends_on: [relay]
    networks: [edge]
    logging: *logging

  relay-access:
    <<: *hardened
    mem_limit: 128m
    build: ./relay-tools
    image: ${RELAY_TOOLS_IMAGE:-commy-relay-tools:local}
    restart: unless-stopped
    command: ["node", "access.mjs"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3342/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      RELAY_ACCESS_MODE: ${RELAY_ACCESS_MODE:-watch}
      RELAY_ACCESS_TOKEN: ${RELAY_ACCESS_TOKEN:-}
      RELAY_ACCESS_AUTH_URLS: ${RELAY_ACCESS_AUTH_URLS:-}
    volumes:
      - relay_meter_data:/data
    networks: [edge]
    logging: *logging

  relay-meter:
    <<: *hardened
    mem_limit: 256m
    build: ./relay-tools
    image: ${RELAY_TOOLS_IMAGE:-commy-relay-tools:local}
    restart: unless-stopped
    environment:
      RELAY_METRICS_URL: http://relay:9090/metrics
      RELAY_MONTHLY_LIMIT_GB: ${RELAY_MONTHLY_LIMIT_GB:-6000}
      RELAY_WARN_PERCENT: ${RELAY_WARN_PERCENT:-75}
      RELAY_PAUSE_PERCENT: ${RELAY_PAUSE_PERCENT:-90}
      RELAY_METER_INTERVAL_SECONDS: ${RELAY_METER_INTERVAL_SECONDS:-60}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - relay_meter_data:/data
      - relay_flags:/flags
    depends_on: [relay]
    networks: [edge]
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: commy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: commy_auth
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commy -d commy_auth"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [db]
    logging: *logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [db]
    logging: *logging

networks:
  edge:
  db:
    internal: true

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  relay_flags:
  relay_meter_data:
