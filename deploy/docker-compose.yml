# Commy self-hosted stack: website + docs, Better Auth server, Postgres, Redis
# for the doorbell and rate limits, an iroh relay with a monthly bandwidth
# meter, and Caddy.
# Usage: cp .env.example .env, fill it in, then docker compose up -d --build
# The website image is published from its own repository (commy-web); set
# WEB_IMAGE to the tag to run, the default below is the production image.

name: commy

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
      - "${RELAY_HTTPS_PORT:-8443}:8443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      DOCS_DOMAIN: ${DOCS_DOMAIN:-docs.${DOMAIN}}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      RELAY_DOMAIN: ${RELAY_DOMAIN:-relay.${DOMAIN}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      auth:
        condition: service_healthy
    networks: [edge]
    logging: *logging

  web:
    image: ${WEB_IMAGE:-ghcr.io/commy-commander/commy-web:prod}
    restart: unless-stopped
    environment:
      AUTH_INTERNAL_URL: http://auth:3001
      PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN}}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      auth:
        condition: service_healthy
    networks: [edge]
    logging: *logging

  auth:
    build: ../auth
    image: ${AUTH_IMAGE:-commy-auth:local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://commy:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/commy_auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${PUBLIC_URL:-https://${DOMAIN}}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      COMMY_INSTANCE_NAME: ${COMMY_INSTANCE_NAME:-Commy}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      INVITES_REQUIRE_ACCOUNT: ${INVITES_REQUIRE_ACCOUNT:-false}
      INVITES_MAX_PERMANENT: ${INVITES_MAX_PERMANENT:-}
      KLIPY_API_KEY: ${KLIPY_API_KEY:-}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      DOORBELL: ${DOORBELL:-true}
      # Doorbell rings and rate-limit counters; leave empty to keep them in
      # Postgres and process memory and drop the redis service below
      REDIS_URL: ${REDIS_URL-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [edge, db]
    logging: *logging

  relay:
    build: ./relay
    image: ${RELAY_IMAGE:-commy-relay:local}
    restart: unless-stopped
    ports:
      # STUN for hole punching; relayed traffic comes in through Caddy on 443
      - "${STUN_PORT:-3478}:3478/udp"
    volumes:
      - relay_flags:/flags:ro
    networks: [edge]
    logging: *logging

  # Fixes iroh-relay 0.28's upgrade response for Caddy and refuses new
  # relay connections while the meter has paused the relay
  relay-proxy:
    build: ./relay-tools
    image: ${RELAY_TOOLS_IMAGE:-commy-relay-tools:local}
    restart: unless-stopped
    command: ["node", "proxy.mjs"]
    volumes:
      - relay_flags:/flags:ro
    depends_on: [relay]
    networks: [edge]
    logging: *logging

  relay-meter:
    build: ./relay-tools
    image: ${RELAY_TOOLS_IMAGE:-commy-relay-tools:local}
    restart: unless-stopped
    environment:
      RELAY_METRICS_URL: http://relay:9090/metrics
      RELAY_MONTHLY_LIMIT_GB: ${RELAY_MONTHLY_LIMIT_GB:-6000}
      RELAY_WARN_PERCENT: ${RELAY_WARN_PERCENT:-75}
      RELAY_PAUSE_PERCENT: ${RELAY_PAUSE_PERCENT:-90}
      RELAY_METER_INTERVAL_SECONDS: ${RELAY_METER_INTERVAL_SECONDS:-60}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - relay_meter_data:/data
      - relay_flags:/flags
    depends_on: [relay]
    networks: [edge]
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: commy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: commy_auth
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commy -d commy_auth"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [db]
    logging: *logging

  # Short-lived state only: doorbell rings (random tokens and blinded ids) and
  # rate-limit counters under keyed hashes, all with an expiry. Snapshots keep
  # rings across a restart; the auth server caps them at 200,000.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [db]
    logging: *logging

networks:
  edge:
  # Postgres and Redis are only reachable from the auth service
  db:
    internal: true

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  relay_flags:
  relay_meter_data:
