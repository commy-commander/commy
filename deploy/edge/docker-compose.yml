# Shared HTTPS entry point for running dev, staging and prod on one server.
# Start this first, then each environment stack. See ../DEPLOYING.md.

name: commy-edge

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    pids_limit: 512
    mem_limit: ${CADDY_MEM_LIMIT:-512m}
    ports:
      - "80:80"
      - "443:443"
      # iroh relays (relay.<domain> and relay-staging.<domain>, DNS only), see ../docker-compose.relay.yml
      - "8443:8443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      PROD_DOMAIN: ${PROD_DOMAIN:?set PROD_DOMAIN in .env}
      STAGING_DOMAIN: ${STAGING_DOMAIN:-staging.${PROD_DOMAIN}}
      DEV_DOMAIN: ${DEV_DOMAIN:-dev.${PROD_DOMAIN}}
      DOCS_DOMAIN: ${DOCS_DOMAIN:-docs.${PROD_DOMAIN}}
      RELAY_DOMAIN: ${RELAY_DOMAIN:-relay.${PROD_DOMAIN}}
      STAGING_RELAY_DOMAIN: ${STAGING_RELAY_DOMAIN:-relay-staging.${PROD_DOMAIN}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Optional Cloudflare origin certificate for hosts behind Cloudflare Access
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
      # JSON access logs for your own log tooling
      - /var/log/commy-caddy:/var/log/caddy
    networks: [prod, staging, dev, relay]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  prod:
    external: true
    name: commy-prod
  staging:
    external: true
    name: commy-staging
  dev:
    external: true
    name: commy-dev
  relay:
    external: true
    name: commy-relay

volumes:
  caddy_data:
  caddy_config:
