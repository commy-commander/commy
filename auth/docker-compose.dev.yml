name: commy-bench

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: commy
      POSTGRES_PASSWORD: commy-dev
      POSTGRES_DB: commy_auth
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bench_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commy -d commy_auth"]
      interval: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

  auth:
    build: .
    environment:
      DATABASE_URL: postgres://commy:commy-dev@postgres:5432/commy_auth
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: local-test-bench-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3001
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      KLIPY_API_KEY: ${KLIPY_API_KEY:-}
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SMTP_REQUIRE_TLS: "false"
      EMAIL_FROM: Commy <no-reply@localhost>
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  studio:
    image: node:24.22.1-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
    environment:
      DATABASE_URL: postgres://commy:commy-dev@postgres:5432/commy_auth
    command:
      - sh
      - -c
      - |
        mkdir -p /studio && cd /studio
        printf 'datasource db {\n  provider = "postgresql"\n  url = env("DATABASE_URL")\n}\n' > schema.prisma
        until npx -y prisma@6.16.2 db pull --schema schema.prisma; do sleep 3; done
        exec npx -y prisma@6.16.2 studio --schema schema.prisma --port 5555 --hostname 0.0.0.0 --browser none
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      auth:
        condition: service_healthy

volumes:
  bench_pg:
