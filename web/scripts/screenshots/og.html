<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:I;src:url(out/inter-800.woff2);font-weight:800}
@font-face{font-family:I;src:url(out/inter-500.woff2);font-weight:500}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:I;background:#0b0d17;position:relative;color:#f6f7fb}
.b{position:absolute;border-radius:50%;filter:blur(80px);opacity:.6}
.a{width:520px;height:520px;left:-160px;top:-120px;background:#ff4d6d}
.c{width:560px;height:560px;right:-120px;bottom:-200px;background:#7a5cff}
.copy{position:absolute;left:72px;top:96px;width:520px}
.brand{display:flex;align-items:center;gap:16px;font-weight:800;font-size:40px;margin-bottom:36px}
.brand img{width:68px;height:68px;border-radius:16px}
h1{font-weight:800;font-size:60px;line-height:1.04;letter-spacing:-2px}
h1 span{background:linear-gradient(100deg,#ff6b6b,#ff5c9e 45%,#8a6bff);-webkit-background-clip:text;color:transparent}
p{margin-top:24px;font-weight:500;font-size:24px;color:#c9cde0}
.shot{position:absolute;left:640px;top:110px;width:760px;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.15);box-shadow:0 30px 80px rgba(0,0,0,.6);transform:perspective(1400px) rotateY(-14deg) rotateX(4deg)}
.shot img{display:block;width:100%}
</style></head><body><div class="b a"></div><div class="b c"></div>
<div class="copy"><div class="brand"><img src="out/logo.png">Commy</div>
<h1>Where your community <span>hangs out</span></h1>
<p>Free, open source chat, voice and game streaming.</p></div>
<div class="shot"><img src="out/chat.jpg"></div></body></html>
