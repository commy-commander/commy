    <path class="f d3" d="M330 90 v28 M316 104 h28" stroke="#4dd0ff"/>
    <path class="f d4" d="M1340 380 l7 17 18 1 -14 11 5 18 -16 -10 -16 10 5 -18 -14 -11 18 -1 z" stroke="#ff6bd6"/>
    <circle class="f d2" cx="1060" cy="70" r="10" stroke="#ffcf4d"/>
    <path class="s" d="M250 700 l22 13 v26 l-22 13 -22 -13 v-26 z" stroke="#a46bff"/>
    <path class="f d1" d="M1390 690 v24 M1378 702 h24" stroke="#ff6b6b"/>
