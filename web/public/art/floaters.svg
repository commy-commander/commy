<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMid slice" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .f { animation: drift 14s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .s { animation: spin 26s linear infinite; transform-box: fill-box; transform-origin: center; }
    .d1 { animation-delay: -3s; } .d2 { animation-delay: -6s; } .d3 { animation-delay: -9s; } .d4 { animation-delay: -12s; }
    @keyframes drift { from { transform: translate(0, 0) rotate(0deg); } to { transform: translate(18px, -28px) rotate(14deg); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .f, .s { animation: none; } }
  </style>
  <g stroke-width="3" opacity=".55">
    <circle class="f" cx="140" cy="170" r="22" stroke="#ff6b6b"/>
    <path class="f d1" d="M1270 120 l26 46 h-52 z" stroke="#a46bff"/>
