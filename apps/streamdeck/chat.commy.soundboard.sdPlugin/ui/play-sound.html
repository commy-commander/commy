<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Play sound</title>
    <link rel="stylesheet" href="inspector.css" />
  </head>
  <body>
    <div class="row">
      <label for="server">Server</label>
      <select id="server" disabled></select>
    </div>
    <div class="row">
      <label for="sound">Sound</label>
      <select id="sound" disabled></select>
    </div>
    <p class="note" id="note">Connecting to Commy...</p>
    <details class="add" id="add" hidden>
      <summary>Add a new sound</summary>
      <p class="note" id="add-locked" hidden>None of your servers let you add sounds yet. A role that can manage sounds, or a server with an open soundboard, unlocks this.</p>
      <div id="add-form">
        <div class="row">
          <label for="add-server">Add to</label>
          <select id="add-server"></select>
        </div>
        <div class="row">
          <label for="add-file">File</label>
          <input type="file" id="add-file" accept=".mp3,.ogg,.wav,.m4a,.flac,.webm,audio/*" />
        </div>
        <div id="add-trim" hidden>
          <div class="row">
            <span></span>
            <div class="wave" id="add-wave"></div>
          </div>
          <div class="row">
            <label for="add-start">Start</label>
            <input type="range" id="add-start" min="0" step="0.1" />
          </div>
          <div class="row">
            <label for="add-end">End</label>
            <input type="range" id="add-end" min="0" step="0.1" />
          </div>
          <div class="row">
            <span></span>
            <div class="inline">
              <button type="button" id="add-play">Play</button>
              <span class="muted" id="add-times"></span>
            </div>
          </div>
        </div>
        <div class="row">
          <label for="add-name">Name</label>
          <input type="text" id="add-name" maxlength="32" autocomplete="off" spellcheck="false" />
        </div>
        <div class="row">
          <label for="add-emoji">Emoji</label>
          <input type="text" id="add-emoji" maxlength="16" autocomplete="off" placeholder="Optional" />
        </div>
        <div class="row">
          <span></span>
          <button type="button" id="add-save" disabled>Upload</button>
        </div>
        <p class="note" id="add-note"></p>
      </div>
    </details>
    <script src="../bin/sound-trim.js"></script>
    <script type="module" src="play-sound.js"></script>
  </body>
</html>
