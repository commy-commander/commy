<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Commy Overlay</title>
  <style>
    @font-face { font-family: "Figtree"; src: url("fonts/figtree-latin.woff2") format("woff2"); font-weight: 300 900; }
    @font-face { font-family: "Space Grotesk"; font-weight: 300 700; src: url("fonts/space-grotesk-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: "Space Grotesk"; font-weight: 300 700; src: url("fonts/space-grotesk-latin-ext.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    :root { --opacity: .92; --accent: #ff4d4d; --ink: #f2efe6; --text: #e2e0da; --display: "Space Grotesk", "Figtree", "Segoe UI", sans-serif;
      --panel: rgba(18, 22, 48, .92); --edge: rgba(242, 239, 230, .08); --raised: #1f2438; --saturation: 100%; }
    html[data-theme="light"] { --ink: #17140f; --text: #2a2721; --panel: rgba(244, 241, 234, .94); --edge: rgba(23, 20, 16, .12); --raised: #e4e0d5; }
    html[data-reduced-motion] .member, html[data-reduced-motion] .line { animation: none; transition: none; }
    html[data-saturation] .line b, html[data-saturation] .notice::before { filter: saturate(var(--saturation)); }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body {
      font-family: "Figtree", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 2px;
      box-sizing: border-box;
      user-select: none;
      opacity: var(--opacity);
      -webkit-font-smoothing: antialiased;
    }
    body.bottom { justify-content: flex-end; }
    body.right { align-items: flex-end; }
    .hidden { display: none !important; }
    body[data-part="voice"] #chat, body[data-part="chat"] #members, body[data-part="chat"] #notice-stack { display: none; }
    .stack { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
    body.right .stack { align-items: flex-end; }
    .member {
      display: flex;
      align-items: center;
      gap: 7px;
      max-width: 250px;
      padding: 0 12px 0 2px;
      border-radius: 999px;
      height: 30px;
      box-sizing: border-box;
      background: var(--panel);
      border: 1px solid var(--edge);
      box-shadow: 0 2px 10px rgba(0, 0, 0, .35);
      animation: pop .14s ease-out;
    }
    .notice {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 30px;
      padding: 0 12px;
      box-sizing: border-box;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--edge);
      box-shadow: 0 2px 10px rgba(0, 0, 0, .35);
      font-family: var(--display);
      font-size: 13px;
      font-weight: 600;
      animation: pop .14s ease-out;
    }
    .notice::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .member:not(.speaking) { opacity: .62; }
    .avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--tint, var(--accent));
      color: #fff;
      font-family: var(--display);
      font-size: 10px;
      font-weight: 700;
      overflow: hidden;
      box-shadow: 0 0 0 2px transparent;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar.emoji { background: var(--raised); font-size: 14px; }
    .member.speaking .avatar { box-shadow: 0 0 0 2px var(--ink); }
    .name { font-family: var(--display); font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
    body.pictures #members { flex-direction: row; flex-wrap: wrap; max-width: 270px; gap: 6px; }
    body.pictures.right #members { justify-content: flex-end; }
    body.pictures .member { height: 34px; width: 34px; padding: 2px; justify-content: center; }
    body.pictures .avatar { width: 28px; height: 28px; font-size: 11px; }
    body.pictures .avatar.emoji { font-size: 16px; }
    .line {
      max-width: 270px;
      padding: 6px 11px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--edge);
      box-shadow: 0 2px 10px rgba(0, 0, 0, .35);
      color: var(--text);
      font-size: 13px;
      line-height: 1.35;
      word-wrap: break-word;
      animation: pop .14s ease-out;
      transition: opacity .5s;
    }
    .line b { font-family: var(--display); font-weight: 600; color: var(--ink); }
    .line.fading { opacity: 0; }
    @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .member, .line { animation: none; } }
  </style>
</head>
<body>
  <div class="stack" id="notice-stack"><div class="notice hidden" id="notice"></div></div>
  <div class="stack" id="members"></div>
  <div class="stack" id="chat"></div>
  <script src="scripts/tint.js"></script>
  <script src="scripts/accessibility.js"></script>
  <script src="scripts/overlay-view.js"></script>
  <script src="scripts/overlay.js"></script>
</body>
</html>
