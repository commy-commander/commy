<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Commy Overlay</title>
  <style>
    @font-face { font-family: "Figtree"; src: url("fonts/figtree-latin.woff2") format("woff2"); font-weight: 300 900; }
    :root { --opacity: .9; --accent: #ff4d4d; --speaking: #35c26b; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body {
      font-family: "Figtree", "Segoe UI", system-ui, sans-serif;
      color: #f2efe6;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 2px;
      box-sizing: border-box;
      user-select: none;
      opacity: var(--opacity);
      -webkit-font-smoothing: antialiased;
    }
    body.bottom { justify-content: flex-end; }
    body.right { align-items: flex-end; }
    .card {
      background: rgba(17, 18, 20, .78);
      border-radius: 10px;
      padding: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .35);
      max-width: 270px;
      box-sizing: border-box;
    }
    .hidden { display: none !important; }
    .where { font-size: 11px; font-weight: 600; color: #b5bac1; padding: 0 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .member { display: flex; align-items: center; gap: 8px; padding: 3px 2px; }
    .avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      font-size: 10px;
      font-weight: 600;
      overflow: hidden;
      box-shadow: 0 0 0 2px transparent;
      transition: box-shadow .08s;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar.emoji { background: #2b2d31; font-size: 14px; }
    .member.speaking .avatar { box-shadow: 0 0 0 2px var(--speaking); }
    .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
    .member:not(.speaking) .name { color: #dbdee1; }
    .chat { display: flex; flex-direction: column; gap: 3px; }
    .line { font-size: 12.5px; line-height: 1.35; word-wrap: break-word; transition: opacity .6s; }
    .line b { font-weight: 600; }
    .line.fading { opacity: 0; }
  </style>
</head>
<body>
  <div class="card hidden" id="voice">
    <div class="where" id="where"></div>
    <div id="members"></div>
  </div>
  <div class="card chat hidden" id="chat"></div>
  <script src="scripts/overlay.js"></script>
</body>
</html>
