<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Commy Overlay</title>
  <style>
    @font-face { font-family: "Figtree"; src: url("fonts/figtree-latin.woff2") format("woff2"); font-weight: 300 900; }
    :root { --opacity: .92; --accent: #ff4d4d; --ink: #f2efe6; --panel: rgba(11, 13, 23, .84); }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body {
      font-family: "Figtree", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 2px;
      box-sizing: border-box;
      user-select: none;
      opacity: var(--opacity);
      -webkit-font-smoothing: antialiased;
    }
    body.bottom { justify-content: flex-end; }
    body.right { align-items: flex-end; }
    .hidden { display: none !important; }
    .stack { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
    body.right .stack { align-items: flex-end; }
    /* Who is talking: one small pill each, nothing at all when it is quiet. */
    .member {
      display: flex;
      align-items: center;
      gap: 7px;
      max-width: 250px;
      padding: 3px 12px 3px 3px;
      border-radius: 999px;
      background: var(--panel);
      box-shadow: 0 2px 10px rgba(0, 0, 0, .35);
      animation: pop .14s ease-out;
    }
    .member:not(.speaking) { opacity: .62; }
    .avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      overflow: hidden;
      box-shadow: 0 0 0 2px transparent;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar.emoji { background: #1f2438; font-size: 14px; }
    .member.speaking .avatar { box-shadow: 0 0 0 2px var(--ink); }
    .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
    /* Messages: a short bubble that goes away by itself. */
    .line {
      max-width: 270px;
      padding: 6px 11px;
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 2px 10px rgba(0, 0, 0, .35);
      font-size: 12.5px;
      line-height: 1.35;
      word-wrap: break-word;
      animation: pop .14s ease-out;
      transition: opacity .5s;
    }
    .line b { font-weight: 700; }
    .line.fading { opacity: 0; }
    @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .member, .line { animation: none; } }
  </style>
</head>
<body>
  <div class="stack" id="members"></div>
  <div class="stack" id="chat"></div>
  <script src="scripts/overlay-view.js"></script>
  <script src="scripts/overlay.js"></script>
</body>
</html>
