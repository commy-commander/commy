id: chat.commy.desktop
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: commy-desktop
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=xdg-download
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-documents:ro
  - --filesystem=xdg-desktop:ro
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: commy
    buildsystem: simple
    sources:
      - type: file
        path: commy.deb
      - type: file
        path: chat.commy.desktop.metainfo.xml
    build-commands:
      - ar x commy.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/commy-desktop -t /app/bin
      - install -Dm644 usr/share/applications/Commy.desktop /app/share/applications/chat.commy.desktop.desktop
      - desktop-file-edit --set-icon=chat.commy.desktop --set-key=Exec --set-value="commy-desktop %u" /app/share/applications/chat.commy.desktop.desktop
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/commy-desktop.png /app/share/icons/hicolor/32x32/apps/chat.commy.desktop.png
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/commy-desktop.png /app/share/icons/hicolor/128x128/apps/chat.commy.desktop.png
      - install -Dm644 usr/share/icons/hicolor/256x256@2/apps/commy-desktop.png /app/share/icons/hicolor/256x256/apps/chat.commy.desktop.png
      - install -Dm644 chat.commy.desktop.metainfo.xml -t /app/share/metainfo
