[package]
name = "commy-desktop"
description = "Commy app for Windows, macOS, Linux, Android and iOS"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "commy_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
commy-core = { workspace = true }
commy-net = { workspace = true }
commy-view = { workspace = true }
commy-audio = { workspace = true }
commy-media = { workspace = true }
commy-sync = { workspace = true, features = ["client"] }
chrono = { workspace = true }
base64 = "0.22"
mime_guess = "2"
data-encoding = { workspace = true }
sha2 = "0.11"
ed25519-dalek = "2"
semver = "1"
rand = "0.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
rfd = "0.17"
open = "5"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_UI_Shell",
] }
tauri-winrt-notification = "0.8"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Storage_EnhancedStorage",
] }
