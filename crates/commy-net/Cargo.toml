[package]
name = "commy-net"
description = "P2P networking for Commy built on iroh: invites, gossip replication, blob transfer"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
cfg_aliases = "0.2"

[dependencies]
commy-core = { workspace = true }
commy-sync = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
data-encoding = { workspace = true }
aes-gcm = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { version = "1", features = ["sync", "io-util", "macros", "rt"] }
tracing = { workspace = true }
chrono = { workspace = true }
iroh = { workspace = true }
iroh-gossip = { workspace = true }
futures-lite = "2"
async-channel = "2"
futures-util = { version = "0.3", features = ["sink"] }
rand = "0.8"
serde_json = { workspace = true }
base64 = "0.22"
n0-future = "0.3"
sha2 = "0.11"

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
tokio = { workspace = true }
iroh-blobs = { workspace = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
iroh-blobs = { version = "0.103", default-features = false }

[dev-dependencies]
commy-core = { workspace = true, features = ["test-support"] }
tokio = { workspace = true }
