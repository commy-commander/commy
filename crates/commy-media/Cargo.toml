[package]
name = "commy-media"
description = "Device I/O and media pipelines for Commy: mic capture, playback mixing, screen capture"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
commy-audio = { workspace = true }
commy-core = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
cpal = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
xcap = "0.9"

[target.'cfg(not(any(windows, target_os = "macos", target_os = "android", target_os = "ios")))'.dependencies]
xcap = "0.4"

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.1"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
