[package]
name = "commy-sync-server"
description = "The Commy sync service: stores and fans out end-to-end encrypted streams it cannot read"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "commy-sync"
path = "src/main.rs"

[dependencies]
commy-sync = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "json"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hmac = "0.13"
sha2 = "0.11"
rand = "0.8"

[target.'cfg(unix)'.dependencies]
rlimit = "0.10"

[dev-dependencies]
commy-sync = { workspace = true, features = ["client"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
